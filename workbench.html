<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PI Studio · 工作台</title>
<style>
:root{
  --bg:#0e1116; --s1:#141a22; --s2:#1a212b; --s3:#212a36; --sunken:#0a0d12;
  --line:#232b37; --line2:#2f3a48; --line3:#3f4b5c;
  --ink:#e8eef5; --ink2:#9dabbd; --ink3:#6d7a8c; --ink4:#4c5866;
  --acc:#5b8cff; --acc2:#7aa2ff; --sel:rgba(91,140,255,.14);
  --ok:#43c06a; --warn:#d8a13a; --err:#f06055;
  --sh:0 10px 30px -14px rgba(0,0,0,.7); --sh2:0 24px 60px -22px rgba(0,0,0,.8);
  --font:"Inter","Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"JetBrains Mono",Consolas,"Cascadia Code",monospace;
  --tabh:32px; --barh:40px;
}
html[data-theme="light"]{
  --bg:#eceff4; --s1:#fff; --s2:#f4f6fa; --s3:#e9edf4; --sunken:#e4e8ef;
  --line:#dde3ec; --line2:#cbd4e1; --line3:#b4c0d2;
  --ink:#0f1722; --ink2:#48566a; --ink3:#76839a; --ink4:#a4afc1;
  --sh:0 10px 26px -16px rgba(16,24,40,.28); --sh2:0 26px 56px -24px rgba(16,24,40,.34);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:12.5px;overflow:hidden;user-select:none;-webkit-font-smoothing:antialiased}
input,select,textarea,button{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line3);border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink4);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
.mono{font-family:var(--mono);font-size:11.5px;color:var(--ink3)}

.qapp{height:100vh;display:grid;grid-template-rows:var(--barh) 1fr;overflow:hidden}
.qbar{display:flex;align-items:center;gap:9px;padding:0 11px;background:var(--s1);border-bottom:1px solid var(--line);overflow-x:auto}
.qbar::-webkit-scrollbar{height:0}
.qlogo{width:21px;height:21px;border-radius:6px;background:linear-gradient(135deg,var(--acc),#8a5bff);display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;font-family:var(--mono);flex:none}
.qt{font-size:12.5px;font-weight:600;white-space:nowrap}
.qbtn{height:27px;padding:0 10px;border-radius:7px;border:1px solid var(--line2);background:var(--s2);color:var(--ink2);font-size:11.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-family:inherit}
.qbtn:hover{border-color:var(--line3);color:var(--ink)}
.qbtn.acc{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.qbtn.acc:hover{filter:brightness(1.1)}
.qbtn.danger{border-color:var(--err);color:var(--err);background:transparent}
.qgrow{flex:1;min-width:8px}
.qpill{font-size:11px;border:1px solid var(--line2);border-radius:999px;padding:3px 9px;color:var(--ink3);white-space:nowrap;background:var(--s2)}
.qpill.ok{color:var(--ok);border-color:rgba(67,192,106,.5)}
.qpill.err{color:var(--err);border-color:rgba(240,96,85,.5)}
.qpill.warn{color:var(--warn);border-color:rgba(216,161,58,.5)}
.qbar .ws{color:var(--ink3);font-family:var(--mono);font-size:11px;max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qbar .ctxbar{width:84px;height:6px;border-radius:4px;background:var(--s3);overflow:hidden;flex:none}
.qbar .ctxbar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}

.qbody{position:relative;overflow:hidden;background:var(--sunken)}
.qroot{position:absolute;inset:0;display:flex}
.qnode{display:flex;min-width:0;min-height:0}
.qnode.col{flex-direction:column}
.qchild{display:flex;min-width:0;min-height:0;position:relative;overflow:hidden;padding:1px}
.qsplit{flex:none;background:var(--line);position:relative;z-index:2;transition:background .12s}
.qsplit.v{width:5px;cursor:col-resize}
.qsplit.h{height:5px;cursor:row-resize}
.qsplit:hover,.qsplit.dragging{background:var(--acc)}

.qpanel{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--s1);border:1px solid var(--line);border-radius:7px;overflow:hidden;transition:box-shadow .15s,border-color .15s}
.qpanel.flash{border-color:var(--acc);box-shadow:0 0 0 3px var(--sel)}
.qtabs{flex:none;height:var(--tabh);display:flex;align-items:stretch;background:var(--s2);border-bottom:1px solid var(--line);overflow:hidden}
.qtabs-scroll{display:flex;align-items:stretch;overflow-x:auto;min-width:0;flex:1}
.qtabs-scroll::-webkit-scrollbar{height:0}
.qtab{display:flex;align-items:center;gap:6px;padding:0 11px;font-size:12px;color:var(--ink3);cursor:grab;border-right:1px solid var(--line);white-space:nowrap;position:relative;transition:color .12s,background .12s}
.qtab svg{width:13px;height:13px;flex:none}
.qtab:hover{background:var(--s3);color:var(--ink2)}
.qtab.active{background:var(--s1);color:var(--ink);font-weight:600}
.qtab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--acc)}
.qtab.dragging{opacity:.4}
.qtab .qx{opacity:0;font-size:13px;line-height:1;color:var(--ink3);padding:0 1px;border-radius:3px}
.qtab:hover .qx{opacity:.7}
.qtab .qx:hover{opacity:1;background:var(--err);color:#fff}
.qtabtools,.qoverflow{display:flex;align-items:center;gap:2px;padding:0 4px;border-left:1px solid var(--line);flex:none;background:var(--s2)}
.qoverflow{border:0;color:var(--ink3);cursor:pointer;width:24px;justify-content:center}
.qoverflow:hover{background:var(--s3);color:var(--ink)}
.qoverflow svg{width:13px;height:13px}
.qtabtools button{width:22px;height:22px;border:0;background:transparent;color:var(--ink3);border-radius:5px;cursor:pointer;display:grid;place-items:center}
.qtabtools button:hover{background:var(--s3);color:var(--ink)}
.qtabtools svg{width:13px;height:13px}
.qcontent{flex:1;overflow:auto;min-height:0;background:var(--s1)}
.qempty{display:grid;place-items:center;height:100%;color:var(--ink4);font-size:12px;padding:20px;text-align:center}

.pad{padding:12px}
.pcardlist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:9px;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--s2)}
.prow:hover{border-color:var(--line2)}
.prow b{font-weight:600;color:var(--ink)}
.prow .tail{margin-left:auto;color:var(--ink3);font-family:var(--mono);font-size:11px}
.prow.click{cursor:pointer}
.prow.on{border-color:var(--acc);background:var(--sel)}
.swt{padding:3px 10px;border:1px solid var(--line);border-radius:6px;font-size:11px;cursor:pointer;margin-left:6px;color:var(--ink3);font-family:inherit;background:transparent}
.swt:hover{border-color:var(--line2);color:var(--ink2)}
.swt.on{background:var(--sel);border-color:var(--acc);color:var(--acc)}
.sw{display:inline-block;width:16px;height:16px;border-radius:5px;margin-left:7px;cursor:pointer;border:2px solid transparent;vertical-align:middle}
.sw.on{border-color:var(--ink)}
.tgl{display:inline-block;width:34px;height:19px;border-radius:10px;background:var(--s3);border:1px solid var(--line2);position:relative;cursor:pointer;vertical-align:middle}
.tgl i{position:absolute;top:1px;left:1px;width:15px;height:15px;border-radius:50%;background:var(--ink3);transition:.15s}
.tgl input{display:none}
.tgl input:checked+i{left:16px;background:var(--acc)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:8px}
.pcell{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--s2)}
.pcell:hover{border-color:var(--line2)}
.pcell b{display:block;font-size:17px;font-family:var(--mono);color:var(--acc);line-height:1.15}
.pcell s{text-decoration:none;font-size:11px;color:var(--ink3)}
.ptag{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:5px;background:var(--s3);color:var(--ink3);border:1px solid var(--line);margin:0 4px 4px 0}
.ptag.ok{color:var(--ok);border-color:rgba(67,192,106,.4)}
.ptag.warn{color:var(--warn);border-color:rgba(216,161,58,.4)}
.ptag.err{color:var(--err);border-color:rgba(240,96,85,.4)}
.ptag.acc{color:var(--acc);border-color:rgba(91,140,255,.4)}
.plog{font-family:var(--mono);font-size:11px;padding:4px 10px;border-bottom:1px solid var(--line);display:flex;gap:9px;color:var(--ink3)}
.plog .t{color:var(--ink4)}
.plog .lv{width:42px;flex:none}
.plog .lv.i{color:var(--acc)}.plog .lv.w{color:var(--warn)}.plog .lv.e{color:var(--err)}.plog .lv.s{color:var(--ok)}
.pflow{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.pflow .st{padding:5px 9px;border:1px solid var(--line);border-radius:6px;background:var(--s2);font-family:var(--mono);font-size:11px;color:var(--ink2)}
.pflow .st.hi{border-color:var(--acc);color:var(--acc);background:var(--sel)}
.pflow .ar{color:var(--ink4)}
.psec{margin-bottom:13px}
.psec h5{margin:0 0 7px;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink4);font-family:var(--mono)}
.hint{color:var(--ink3);font-size:11.5px;line-height:1.6}

/* 表单 / 表格 / 代码 */
.wbrow{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.wbfld{margin-bottom:8px}
.wbfld label{display:block;font-size:11px;color:var(--ink3);margin-bottom:4px;font-family:var(--mono)}
.wbfld input,.wbfld select,.wbrow input,.wbrow select,.wbfld textarea{
  width:100%;background:var(--sunken);border:1px solid var(--line2);border-radius:7px;padding:6px 9px;outline:none;font-size:12px}
.wbfld textarea{min-height:96px;resize:vertical;font-family:var(--mono);line-height:1.6}
.wbfld input:focus,.wbfld select:focus,.wbrow input:focus,.wbfld textarea:focus{border-color:var(--acc)}
.wbrow input,.wbrow select{flex:1;min-width:110px;width:auto}
pre{background:var(--sunken);border:1px solid var(--line);border-radius:7px;padding:9px 11px;overflow:auto;margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:11.5px;color:var(--ink2);max-height:340px;user-select:text}
.tbl{width:100%;border-collapse:collapse;font-size:11.5px}
.tbl th{text-align:left;color:var(--ink4);font-weight:500;font-family:var(--mono);font-size:10.5px;padding:5px 7px;border-bottom:1px solid var(--line)}
.tbl td{padding:5px 7px;border-bottom:1px solid var(--line);color:var(--ink2);font-family:var(--mono)}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--s2)}
.tbl tbody tr.sel td{background:var(--sel);color:var(--acc)}
.tag{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:4px;background:var(--s3);color:var(--ink3)}

/* 对话 */
.chat{display:flex;flex-direction:column;height:100%}
.chat .stream{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px;user-select:text}
.msg{display:flex;gap:10px;max-width:90%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.av{width:26px;height:26px;border-radius:7px;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;font-family:var(--mono)}
.av.ai{background:linear-gradient(135deg,var(--acc),#8a5bff)}
.av.me{background:var(--s3);color:var(--ink2)}
.bub{padding:9px 12px;border-radius:11px;background:var(--s2);border:1px solid var(--line);font-size:12.5px;line-height:1.65;color:var(--ink);overflow-wrap:anywhere}
.msg{content-visibility:auto;contain-intrinsic-size:auto 60px}
.codeblk{position:relative}
.codeblk .cpbtn{position:absolute;top:5px;right:7px;font-size:10px;padding:1px 7px;border-radius:5px;border:1px solid var(--line);background:var(--s2);color:var(--ink3);cursor:pointer;opacity:.75}
.codeblk .cpbtn:hover{opacity:1;color:var(--ink)}
.mdtable{border-collapse:collapse;margin:7px 0;font-size:11.5px}
.mdtable th,.mdtable td{border:1px solid var(--line);padding:3px 8px;text-align:left}
.mdtable th{background:var(--sunken);font-weight:600}
.mdimg{max-width:100%;border-radius:7px;border:1px solid var(--line);margin:5px 0;display:block}
.bub a{color:var(--acc)}
.msg.me .bub{background:var(--sel);border-color:rgba(91,140,255,.35)}
.bub .who{font-size:10.5px;color:var(--ink3);margin-bottom:4px;font-family:var(--mono)}
.bub pre{margin:6px 0;max-height:none}
.bub code{background:var(--sunken);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-family:var(--mono);font-size:11.5px}
.bub b{color:var(--ink)}
.meta{font-size:10.5px;color:var(--ink4);margin-top:5px;font-family:var(--mono)}
.msg .think{border-left:2px solid var(--line2);padding-left:9px;margin:2px 0 7px;color:var(--ink3);font-size:12.5px;white-space:pre-wrap;max-height:150px;overflow:auto}
.msg .thinkbar{display:none;align-items:center;gap:8px;margin:0 0 7px}
.msg .thinkbar button{font-size:11.5px;padding:2px 9px;line-height:1.6}
.msg .thinkbar .trstate{font-size:11px;color:var(--ink3)}
.msg .thinkzh{display:none;border-left:2px solid var(--acc);background:var(--sunken);padding:7px 10px;margin:0 0 8px;font-size:12.5px;max-height:240px;overflow:auto;border-radius:0 6px 6px 0}
.msg .thinkzh .pair{margin:0 0 7px}
.msg .thinkzh .pair:last-child{margin-bottom:0}
.msg .thinkzh .en{color:var(--ink3);white-space:pre-wrap}
.msg .thinkzh .zh{color:var(--ink);white-space:pre-wrap}
.msg .thinkzh .zh:before{content:'\21b3 ';color:var(--acc)}
.composer .att.off{opacity:.45}
.composer{flex:none;border-top:1px solid var(--line);padding:9px 11px;background:var(--s2);display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;height:46px;resize:none;border:1px solid var(--line2);border-radius:9px;background:var(--sunken);color:var(--ink);font-family:inherit;font-size:12.5px;padding:9px 11px;outline:none;line-height:1.55}
.composer textarea:focus{border-color:var(--acc)}
.composer .snd{height:34px;width:34px;border-radius:9px;border:1px solid var(--acc);background:var(--acc);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.composer .snd svg{width:15px;height:15px}
.composer .snd:hover{background:var(--acc2)}
.composer .snd.stop{background:var(--err);border-color:var(--err)}
.composer .att{height:34px;width:34px;border-radius:9px;border:1px solid var(--line2);background:var(--s2);color:var(--ink2);display:grid;place-items:center;cursor:pointer;flex:none}
.composer .att:hover{color:var(--acc);border-color:var(--acc)}
.chat .attwrap{display:none;flex-wrap:wrap;gap:6px;padding:8px 12px 0;align-items:center}
.chat .attwrap .attchip{display:inline-flex;align-items:center;gap:5px;font-size:11px;border:1px solid var(--line2);border-radius:7px;padding:3px 8px;color:var(--ink2);background:var(--s2)}
.chat .attwrap .attchip i{cursor:pointer;font-style:normal;color:var(--ink4)}
.chat .attwrap .attchip i:hover{color:var(--err)}
.qacts{display:flex;gap:1px;flex:none;align-items:center}
.qia{cursor:pointer;color:var(--ink4);padding:0 3px;font-style:normal;font-size:12px}
.qia:hover{color:var(--acc)}
.notice{font-size:11.5px;color:var(--ink3);border-left:2px solid var(--line3);padding:4px 0 4px 9px;font-family:var(--mono);white-space:pre-wrap;user-select:text}
.notice.err{color:var(--err);border-color:var(--err)}
.toolcard{border:1px solid var(--line);border-radius:9px;background:var(--s2);overflow:hidden;min-width:0}
.toolcard .th{display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer;font-size:11.5px}
.toolcard .th .nm{font-family:var(--mono);color:var(--acc)}
.toolcard .th .st{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
.toolcard .tb{display:none;padding:0 10px 10px}
.toolcard.open .tb{display:block}
.spin{display:inline-block;width:9px;height:9px;border:2px solid var(--line3);border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}

#ghost{position:fixed;z-index:900;pointer-events:none;background:var(--s3);border:1px solid var(--acc);border-radius:6px;padding:5px 10px;font-size:12px;color:var(--ink);box-shadow:var(--sh2);display:none}
#dropind{position:fixed;z-index:880;pointer-events:none;background:rgba(91,140,255,.22);border:1px solid var(--acc);border-radius:6px;display:none;transition:all .07s}
#edgeind{position:fixed;z-index:880;pointer-events:none;background:rgba(91,140,255,.18);border:1px solid var(--acc);display:none}
#reorderind{position:fixed;z-index:881;width:2px;border-radius:2px;background:var(--acc);display:none;pointer-events:none}

.qfloat{position:fixed;z-index:700;background:var(--s1);border:1px solid var(--line2);border-radius:9px;box-shadow:var(--sh2);display:flex;flex-direction:column;overflow:hidden;min-width:220px;min-height:140px}
.qfloat>.qtabs{cursor:move;background:var(--s3)}
.qfloat.min .qcontent{display:none}
.qfloat .qrsz{position:absolute;right:0;bottom:0;width:15px;height:15px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,var(--line3) 50%)}
.qfloat .qrsz:hover{background:linear-gradient(135deg,transparent 50%,var(--acc) 50%)}

#menu{position:fixed;z-index:950;background:var(--s2);border:1px solid var(--line2);border-radius:9px;padding:5px;min-width:190px;box-shadow:var(--sh2);display:none;max-height:70vh;overflow:auto}
#menu .mi{padding:7px 10px;border-radius:6px;font-size:12px;color:var(--ink2);cursor:pointer;display:flex;align-items:center;gap:9px}
#menu .mi:hover{background:var(--sel);color:var(--acc)}
#menu .mi svg{width:13px;height:13px}
#menu .mi kbd{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink4);border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--s1)}
#menu .mh{padding:6px 10px 4px;font-size:10.5px;color:var(--ink4);font-family:var(--mono);letter-spacing:.6px}
#menu .msep{height:1px;background:var(--line);margin:4px 6px}

#palette{position:fixed;inset:0;z-index:945;background:rgba(6,9,13,.5);display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
#palette.on{display:flex}
#palette .pbox{width:min(580px,92vw);background:var(--s1);border:1px solid var(--line2);border-radius:11px;box-shadow:var(--sh2);overflow:hidden}
#palette input{width:100%;height:44px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font-size:13.5px;padding:0 15px;outline:none;font-family:inherit}
#palList{max-height:48vh;overflow:auto;padding:5px}
#palList .pi{padding:8px 11px;border-radius:7px;font-size:12.5px;color:var(--ink2);cursor:pointer;display:flex;gap:9px;align-items:center}
#palList .pi.on{background:var(--sel);color:var(--acc)}
#palList .pi svg{width:13px;height:13px}
#palList .pi small{margin-left:auto;color:var(--ink4);font-family:var(--mono);font-size:10.5px}

#modal{position:fixed;inset:0;z-index:960;background:rgba(6,9,13,.55);display:none;align-items:center;justify-content:center}
#modal.on{display:flex}
#modal .mbox{width:min(620px,94vw);background:var(--s1);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--sh2);padding:16px}
#modal h4{margin:0 0 8px;font-size:14px}
#modal textarea{width:100%;min-height:150px;background:var(--sunken);border:1px solid var(--line2);border-radius:8px;padding:9px;font-family:var(--mono);font-size:11.5px;color:var(--ink);outline:none;resize:vertical}
#modal .warn{color:var(--warn);font-size:11.5px;white-space:pre-wrap;margin:8px 0;line-height:1.6}
#modal .err{color:var(--err);font-size:11.5px;min-height:16px;margin:6px 0}
#qa{position:fixed;inset:0;z-index:965;background:rgba(6,9,13,.55);display:none;align-items:center;justify-content:center}
#qa.on{display:flex}
#qa .mbox{width:min(680px,94vw);max-height:88vh;display:flex;flex-direction:column;background:var(--s1);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--sh2);padding:16px}

};

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

/* ---------- 后端客户端 ---------- */
const QS=new URLSearchParams(location.search);
let TOK=QS.get('t')||'';
if(TOK){ try{localStorage.setItem('pi-token',TOK);}catch(e){} }
else { try{TOK=localStorage.getItem('pi-token')||'';}catch(e){} }

const S={state:null,sid:null,session:null,cps:[],pending:null,ask:null,
  allow:{},selCp:null,obs:{turns:0,tools:0,errs:0,last:null,ms:0},
  views:{},sessSort:'time'};

function api(path,body){
  const opt={headers:{'X-PI-Token':TOK}};
  if(body!==undefined){opt.method='POST';opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body);}
  return fetch(path+(path.includes('?')?'&':'?')+'t='+encodeURIComponent(TOK),opt).then(r=>r.json());
}
function setMsg(t,cls){ const e=$('#wbMsg'); if(e){ e.textContent=t; e.className='qpill'+(cls?' '+cls:''); } }

  else if(ok){e.textContent='已连接';e.className='qpill ok';}

/* ---------- 渲染增强（本地化库 marked / highlight.js / mermaid / KaTeX；缺库自动回退内置渲染） ---------- */
function syncHljsTheme(){
  const dark=document.documentElement.dataset.theme!=='light';
  const a=document.getElementById('hljsDark'), b=document.getElementById('hljsLight');
  if(a) a.disabled=!dark;
  if(b) b.disabled=dark;
}
try{ syncHljsTheme(); new MutationObserver(syncHljsTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']}); }catch(e){}
function sanitizeHTML(h){
  return String(h)
    .replace(/<script[\s\S]*?<\/script>/gi,'')
    .replace(/<iframe[\s\S]*?<\/iframe>/gi,'')
    .replace(/\son[a-z]+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi,'')
    .replace(/javascript:/gi,'');
}
let _mermaidReady=false;
function ensureMermaid(){
  if(_mermaidReady||!window.mermaid)return;
  try{ window.mermaid.initialize({startOnLoad:false,securityLevel:'strict',
    theme:document.documentElement.dataset.theme==='light'?'default':'dark'}); _mermaidReady=true; }catch(e){}
}
function enhance(root){
  if(!root)return;
  try{    // 代码高亮 + 复制按钮
    root.querySelectorAll('pre code').forEach(el=>{ if(!el.dataset.hl){ el.dataset.hl='1'; try{ window.hljs&&window.hljs.highlightElement(el); }catch(_){} } });
    root.querySelectorAll('pre').forEach(pre=>{
      if(pre.parentElement&&pre.parentElement.classList.contains('codeblk'))return;
      const wrap=document.createElement('div'); wrap.className='codeblk';
      pre.parentNode.insertBefore(wrap,pre); wrap.appendChild(pre);
      const b=document.createElement('button'); b.className='cpbtn'; b.type='button'; b.textContent='复制'; wrap.appendChild(b);
    });
  }catch(e){}
  try{    // KaTeX（$…$ / $$…$$ / \(..\) / \[..\]）
    root.querySelectorAll('.bub').forEach(b=>{ if(b.dataset.mh)return; b.dataset.mh='1';
      if(window.renderMathInElement) window.renderMathInElement(b,{
        delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},
                    {left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],
        throwOnError:false,ignoredTags:['script','noscript','style','textarea','pre','code']}); });
  }catch(e){}
  try{    // Mermaid（```mermaid 代码块 → 图）
    const blocks=[...root.querySelectorAll('code.language-mermaid')];
    if(blocks.length&&window.mermaid){
      ensureMermaid();
      blocks.forEach((code,i)=>{
        const pre=code.closest('pre'); if(!pre)return;
        const d=document.createElement('div'); d.className='mermaid';
        d.textContent=code.textContent||'';
        pre.replaceWith(d);
      });
      const nodes=[...root.querySelectorAll('.mermaid')].filter(n=>!n.dataset.done);
      nodes.forEach(n=>{ n.dataset.done='1'; });
      if(nodes.length) Promise.resolve(window.mermaid.run({nodes})).catch(()=>{});
    }
  }catch(e){}
}
function mdRich(src){
  try{ window.marked.setOptions({gfm:true,breaks:true});
    return sanitizeHTML(window.marked.parse(String(src))); }
  catch(e){ return null; }
}
/* Markdown（本地 marked 优先；缺库回退内置渲染器。两者同一渲染口径） */
function md(src){
  if(window.marked){ const rich=mdRich(src); if(rich!==null&&rich!=='')return rich; }
  let t=esc(src);
  const blocks=[];
  t=t.replace(/```([a-zA-Z0-9_+-]*)\n?([\s\S]*?)```/g,(m,lang,code)=>{
    blocks.push('<div class="codeblk"><button class="cpbtn" type="button">复制</button><pre>'+code.replace(/\n$/,'')+'</pre></div>');
    return '\u0000B'+(blocks.length-1)+'\u0000';});
  t=t.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,(m,alt,src2)=>{
    const u=/^(https?:\/\/|\/api\/)/.test(src2)?src2
      :('/api/fs/raw?path='+encodeURIComponent(src2)+'&t='+encodeURIComponent(TOK||''));
    return '<img class="mdimg" src="'+u+'" alt="'+alt+'" loading="lazy">';});
  t=t.replace(/\u0000B(\d+)\u0000/g,(m,i)=>blocks[+i]);   // 先还原代码块，块内不再做行内替换
  t=t.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  t=t.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
  t=t.replace(/^### (.*)$/gm,'<b>$1</b>');
  t=t.replace(/^## (.*)$/gm,'<b>$1</b>');
  t=t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  t=t.replace(/(^|\n)\|(.+)\|\n\|[\s:|-]+\|\n((?:\|.*\|(?:\n|$))*)/g,(m,lead,head,body)=>{
    const th=head.split('|').map(s=>s.trim());
    const rows=String(body).trim().split('\n').filter(r=>r.indexOf('|')>=0)
      .map(r=>r.replace(/^\||\|$/g,'').split('|').map(s=>s.trim()));
    return lead+'<table class="mdtable"><thead><tr>'+th.map(x=>'<th>'+x+'</th>').join('')+
      '</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table>\n';});
  t=t.replace(/(^|\n)([-*·]) /g,'$1• ');
  return t;
}
function stripMarks(s){
  s=String(s||'');
  if(s.indexOf('DSML')<0)return s;
  s=s.replace(/<[^>]*DSML[^>]*>\s*invoke\b[^>]*>[\s\S]*?<\/[^>]*DSML[^>]*>\s*invoke\s*>/gi,'');
  s=s.replace(/<\/?[^>]*DSML[^>]*>\s*(?:tool_calls|function_calls|calls)\s*>/gi,'');
  s=s.replace(/<\/?[^>]*DSML[^>]*>/gi,'');
  return s.replace(/\n{3,}/g,'\n\n').trim();
}
function bubbleBody(text){
  text=stripMarks(text);
  const hasBlock=/```|^\s*[-*] |\*\*/.test(text);
  return hasBlock?md(text):('<span style="white-space:pre-wrap">'+esc(text)+'</span>');
}

const PANEL_IDS=Object.keys(P);
/* 面板锁定集合：网页版全部解锁（对话面板也可自由停靠 / 浮动 / 关闭） */
const LOCKED=new Set();

/* ============================================================
   多对话视图状态（sid 维度）
   每个会话一份独立视图：流式文本 / 本轮事件（live 缓冲）/ 输入框 / 附件 / 工具卡。
   live 缓冲是「重绘不丢内容」的关键：任何全量重绘都能从 历史消息 + live 完整恢复。
   ============================================================ */
const CHAT_PREFIX='chat:';
function isChatId(id){ return typeof id==='string'&&(id==='chat'||id.indexOf(CHAT_PREFIX)===0); }
function chatSidOf(id){ return id==='chat'?'':String(id||'').slice(CHAT_PREFIX.length); }
function chatId(sid){ return CHAT_PREFIX+(sid||''); }
function sessTitle(sid){ const x=((S.state&&S.state.sessions)||[]).find(s=>s.id===sid); return x?(x.title||'会话'):''; }
function V(sid){
  sid=sid||S.sid||'';
  let v=S.views[sid];
  if(!v){ v=S.views[sid]={sid,stream:'',live:[],busy:false,runId:null,els:null,attach:[],noCap:false,
    open:{},session:null,cps:[],runTools:[],stick:true,loaded:false}; }
  return v;
}
function panelDef(id){
  if(P[id])return P[id];
  if(isChatId(id)){
    const sid=chatSidOf(id), v=S.views[sid];
    return {t:(sessTitle(sid)||'对话')+(v&&v.busy?' ●':''),i:'chat',chat:sid,blank:true};
  }
  return {t:String(id),i:'info'};
}
function findPanelWrap(node){ return $$('.qpanel').find(p=>p.__node===node)||null; }
function findTabEl(pid){
  const node=findTabsWith(LAYOUT,pid); if(!node)return null;
  const wrap=findPanelWrap(node); if(!wrap)return null;
  return $$('.qtab',wrap)[node.items.indexOf(pid)]||null;
}
function cssEsc(s){ return String(s==null?'':s).replace(/["\\]/g,'\\$&'); }
function updateChatTabs(){
  allTabsNodes(LAYOUT,[]).forEach(node=>{
    const wrap=findPanelWrap(node); if(!wrap)return;
    node.items.forEach((pid,i)=>{
      if(!isChatId(pid))return;
      const nm=$$('.qtab',wrap)[i]; if(!nm)return;
      const sp=nm.querySelector('span'); if(sp) sp.textContent=panelDef(pid).t;
    });
  });
}
/* ---------- 对话面板 ---------- */
function chatView(sid){
  const t=sessTitle(sid)||'对话';
  const v=V(sid);
  return `<div class="chat" data-sid="${esc(sid)}">
    <div class="chathead">
      <span class="cnm" title="${esc(sid)}">${esc(t)}</span>
      <span class="cst ${v.busy?'busy':''}">${v.busy?'生成中 ●':'就绪'}</span>
      <span class="qgrow"></span>
      <button class="qbtn mini" data-cact="sessions" title="打开会话面板">会话</button>
      <button class="qbtn mini" data-cact="new" title="新建会话并在此打开">＋会话</button>
      <button class="qbtn mini" data-cact="export" title="导出这个会话为 Markdown">导出</button>
      <button class="qbtn mini" data-cact="close" title="关闭这个对话面板（会话与记录都保留）">✕</button>
    </div>
    <div class="stream" id="wbStream"></div>
    <div class="attwrap" id="wbAttWrap"></div>
    <div class="composer"><button class="att" id="wbAttach" title="附加文本文件（内容随消息发送，单个上限 120000 字符）">${svg('clip',15)}</button>
    <button class="att" id="wbAutoTr" title="思考自动译中（插件 ms-translate · 微软 Bing 网页端，免 key）：开启后每轮结束自动把思考里的英文译成中文并对照显示；也可点思考块里的「译成中文」随时翻译">译</button>
    <textarea id="wbInput" placeholder="输入消息… ⏎ 发送 / ⇧⏎ 换行 / 输入 /help 看命令"></textarea>
    <button class="snd" id="wbSend" title="发送">${svg('send')}</button></div></div>`;
}
function streamEl(sid){ return (V(sid).els&&V(sid).els.stream)||null; }
/* ---------- 对话渲染（历史消息 + 本轮 live 缓冲） ---------- */
function thinkHTML(txt,open){
  if(!txt)return '';
  return `<div class="thinkwrap${open?' open':''}"><div class="thinkhd"><span class="icn">思考</span><span class="len">${String(txt).length} 字</span><span class="tg">${open?'收起':'展开'}</span><button class="thinktr" type="button">译成中文</button></div><div class="think">${esc(txt)}</div><div class="thinkzh"></div></div>`;
}
function metaHTML(x){
  const u=x.usage||{};
  return `<div class="meta">${x.steps?('步数 '+x.steps+' · '):''}${u.total_tokens?('tokens '+u.total_tokens+' · '):''}${x.elapsed?((x.elapsed)+'s'):''}</div>`;
}
function toolCardHTML(x,idx){
  const ok=x.ok!==false, running=!!x.running;
  const out=String(x.text==null?'':x.text);
  const clipped=out.length>8000;
  return `<div class="msg" style="max-width:96%"${idx==null?'':' data-live="'+idx+'"'}><div class="av ai">⚙</div>
    <div class="toolcard${running?' open':''}" data-tid="${esc(x.id||'')}">
      <div class="th"><span class="nm">${esc(x.name||'tool')}</span>
      <span class="st">${running?'<span class="spin"></span> 运行中':(ok?'<span style="color:var(--ok)">✔</span>':'<span style="color:var(--err)">✘</span>')+' '+(x.ms||0)+'ms'}</span></div>
      <div class="tb"><div class="hint">参数</div><pre class="args">${esc(JSON.stringify(x.args||{},null,1))}</pre>
      <div class="hint" style="margin-top:6px">输出</div><pre class="out">${esc(clipped?out.slice(0,8000):out)}</pre>${clipped?'<div class="hint">已截断显示（共 '+out.length+' 字符）</div>':''}</div>
    </div></div>`;
}
function liveItemHTML(x,i){
  if(x.k==='user') return `<div class="msg me"><div class="av me">你</div><div class="bub"><div class="who">你 · ${fmtT(x.ts)}</div>${bubbleBody(x.text||'')}</div></div>`;
  if(x.k==='assistant') return `<div class="msg"><div class="av ai">π</div><div class="bub"><div class="who">PI · ${fmtT(x.ts)}</div><div class="tx">${bubbleBody(x.text||'')}</div>${metaHTML(x)}</div></div>`;
  if(x.k==='think') return `<div class="msg"><div class="av ai">π</div><div class="bub">${thinkHTML(x.text,true)}</div></div>`;
  if(x.k==='tool') return toolCardHTML(x,i);
  if(x.k==='notice') return `<div class="notice${x.err?' err':''}">${esc(x.text||'')}</div>`;
  return '';
}
function renderMsgs(sid){
  const v=V(sid), box=streamEl(sid); if(!box)return;
  const all=(v.session&&v.session.messages)||[];
  const live=v.live||[];
  if(!all.length&&!live.length){
    box.innerHTML=`<div class="notice">这个会话还没有消息。直接输入即可。
· 模型会自己决定调哪个本机工具，过程以工具卡显示在这里（点标题展开参数与输出）。
· 写入类工具会弹审批框，框里的 JSON 可以直接改，改完点「允许执行」。
· 每次写入都会在「变更」面板留一条检查点，随时一键回滚。
· 输入 /help 查看斜杠命令；会话面板里点会话即可再开一个对话面板并排看。</div>`;
    return;
  }
  const CAP=400;
  const start=(v.noCap||all.length<=CAP)?0:all.length-CAP;
  const msgs=all.slice(start);
  let html='';
  if(start>0) html+=`<div class="notice">已折叠较早的 ${start} 条消息（性能模式） · <a href="#" class="showall">显示全部</a></div>`;
  msgs.forEach((m,idx)=>{ const i=idx+start;
    if(m.role==='user'){
      html+=`<div class="msg me" data-i="${i}"><div class="av me">你</div><div class="bub"><div class="who">你 · ${fmtT(m.ts)}</div>${bubbleBody(String(m.content||''))}</div></div>`;
    } else if(m.role==='assistant'){
      const txt=String(m.content||''), think=String(m.reasoning||m.thinking||'');
      if(txt||think||(m.tool_calls||[]).length){
        html+=`<div class="msg" data-i="${i}"><div class="av ai">π</div><div class="bub"><div class="who">PI · ${fmtT(m.ts)}</div>`
          +thinkHTML(think,false)
          +(txt?('<div class="tx">'+bubbleBody(txt)+'</div>'):'')
          +`<div class="meta">${m.steps?('步数 '+m.steps+' · '):''}${(m.usage&&m.usage.total_tokens?('tokens '+m.usage.total_tokens):'')}</div></div></div>`;
      }
      (m.tool_calls||[]).forEach(c=>{
        const fn=(c.function||{});
        let args={}; try{ args=(typeof fn.arguments==='string')?JSON.parse(fn.arguments||'{}'):(fn.arguments||{}); }catch(_){ args={raw:fn.arguments}; }
        html+=toolCardHTML({name:fn.name,args,ok:true,ms:0,text:'（这是调用记录；结果见下面的输出卡）',running:false,id:''});
      });
    } else if(m.role==='tool'){
      const ok=m.ok!==false;
      html+=`<div class="msg" data-i="${i}" style="max-width:96%"><div class="av ai">⚙</div>
        <div class="toolcard" style="flex:1"><div class="th"><span class="nm">${esc(m.name||'tool')}</span>
        <span class="st" style="color:${ok?'var(--ok)':'var(--err)'}">${ok?'✔':'✘'} ${m.ms||0}ms</span></div>
        <div class="tb"><div class="hint">参数</div><pre>${esc(JSON.stringify(m.args||{},null,1))}</pre>
        <div class="hint" style="margin-top:6px">输出</div><pre>${esc(String(m.content||''))}</pre></div></div></div>`;
    }
  });
  html+=live.map((x,i)=>liveItemHTML(x,i)).join('');
  box.innerHTML=html;
  try{ enhance(box); }catch(e){}
  if(v.stick!==false) box.scrollTop=box.scrollHeight;
}
/* 重绘当前对话面板（不动整棵布局树） */
function renderChat(sid){ return refreshPanel(chatId(sid)); }
/* live 工具卡：追加 / 就地更新（重绘后仍能按 data-tid 对上） */
function appendLiveTool(sid,x){
  V(sid).live.push(x);
  const box=streamEl(sid); if(!box)return;
  const idx=V(sid).live.length-1;
  const tmp=document.createElement('div'); tmp.innerHTML=toolCardHTML(x,idx);
  const node=tmp.firstElementChild; if(node)box.appendChild(node);
  box.scrollTop=box.scrollHeight;
}
function updateLiveTool(sid,tid,x){
  const box=streamEl(sid); if(!box)return;
  const el=box.querySelector('.toolcard[data-tid="'+cssEsc(tid)+'"]'); if(!el)return;
  const ok=x.ok!==false, st=el.querySelector('.st');
  if(st) st.innerHTML=(ok?'<span style="color:var(--ok)">✔</span>':'<span style="color:var(--err)">✘</span>')+' '+(x.ms||0)+'ms';
  const out=el.querySelector('pre.out'); if(out) out.textContent=String(x.text||'');
}
function chatBind(root,sid){
  const v=V(sid);
  v.els={stream:$('#wbStream',root),input:$('#wbInput',root),send:$('#wbSend',root),attwrap:$('#wbAttWrap',root)};
  const box=v.els.stream;
  if(box) box.addEventListener('scroll',()=>{ v.stick=(box.scrollHeight-box.scrollTop-box.clientHeight)<40; },{passive:true});
  renderMsgs(sid);
  setBusy(sid,v.busy);
  v.attach=v.attach||[];
  renderAtt(sid);
  const at=$('#wbAttach',root); if(at) at.addEventListener('click',()=>pickAttach(sid));
  const atr=$('#wbAutoTr',root);
  if(atr){
    if(localStorage.getItem('piAutoTr')==='0') atr.classList.add('off');
    atr.addEventListener('click',()=>{
      atr.classList.toggle('off');
      const on=!atr.classList.contains('off');
      localStorage.setItem('piAutoTr', on?'1':'0');
      try{ setMsg(on?'思考自动译中：开':'思考自动译中：关', on?'ok':'warn'); }catch(e){}
    });
  }
  const ta=v.els.input, snd=v.els.send;
  if(ta) ta.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send(sid);} });
  if(snd) snd.addEventListener('click',()=>send(sid));
  const head=$('.chathead',root);
  if(head) head.addEventListener('click',async e=>{
    const act=e.target.getAttribute&&e.target.getAttribute('data-cact'); if(!act)return;
    if(act==='sessions') focusPanel('sessions');
    else if(act==='new'){ const r=await api('/api/session/new',{title:'新会话'}); await loadState(); await openChatPanel(r.session.id); }
    else if(act==='export') exportMarkdown(v.session);
    else if(act==='close') closePanel(chatId(sid));
  });
  if(box) box.addEventListener('click',e=>{
    const th=e.target.closest('.toolcard .th'); if(th){ th.parentElement.classList.toggle('open'); return; }
    const hd=e.target.closest('.thinkhd');
    if(hd){ const w=hd.parentElement; w.classList.toggle('open');
      const tg=hd.querySelector('.tg'); if(tg) tg.textContent=w.classList.contains('open')?'收起':'展开'; return; }
    const cp=e.target.closest('.cpbtn');
    if(cp){ const pre=cp.parentElement.querySelector('pre');
      try{ navigator.clipboard.writeText(pre?pre.textContent:''); cp.textContent='已复制'; setTimeout(()=>cp.textContent='复制',900); }catch(_){}
      return; }
    const sa=e.target.closest('.showall');
    if(sa){ e.preventDefault(); v.noCap=true; renderMsgs(sid); return; }
    const tb=e.target.closest('.thinktr');
    if(tb){ const m=tb.closest('.msg'); if(m) translateThinking(m); return; }
  });
  if(box) box.addEventListener('contextmenu',e=>msgMenu(e,sid));
}
/* 附件：与原生 app 的 drain_attachments 同一口径（读文本 → 【附件 名 · N 字符】代码块） */
function renderAtt(sid){
  const v=V(sid);
  const wrap=v.els&&v.els.attwrap; if(!wrap)return;
  const a=v.attach||[];
  wrap.style.display=a.length?'flex':'none';
  wrap.innerHTML=a.length?(a.map((f,i)=>`<span class="attchip">📄 ${esc(f.name)} · ${f.chars} 字符 <i data-rm="${i}" title="移除">✕</i></span>`).join('')+'<span class="hint" style="align-self:center">发送时随消息一起附加</span>'):'';
  wrap.onclick=e=>{ const i=e.target.getAttribute('data-rm'); if(i===null)return; v.attach.splice(+i,1); renderAtt(sid); };
}
function pickAttach(sid){
  const v=V(sid);
  const inp=document.createElement('input'); inp.type='file'; inp.multiple=true;
  inp.addEventListener('change',()=>{
    [...inp.files].forEach(f=>{
      const rd=new FileReader();
      rd.onload=()=>{ const body=String(rd.result||'').slice(0,120000);
        v.attach.push({name:f.name,chars:body.length,body}); renderAtt(sid); setMsg('已附加：'+f.name); };
      rd.onerror=()=>setMsg('读取失败：'+f.name,'warn');
      rd.readAsText(f);
    });
  });
  inp.click();
}
function attText(sid){
  const a=V(sid).attach||[]; if(!a.length)return '';
  return a.map(f=>`【附件 ${f.name} · ${f.chars} 字符】\n\`\`\`\n${f.body}\n\`\`\``).join('\n\n');
}
function setBusy(sid,b){
  sid=sid||S.sid; const v=V(sid); v.busy=!!b;
  const els=v.els||{}, s=els.send, i=els.input;
  if(s){ s.classList.toggle('stop',!!b); s.innerHTML=b?svg('close'):svg('send'); s.title=b?'停止生成':'发送'; }
  if(i) i.placeholder=b?'生成中… 点右侧停止 / Esc':'输入消息… ⏎ 发送 / ⇧⏎ 换行 / 输入 /help 看命令';
  const id=chatId(sid), tab=findTabEl(id);
  if(tab){ const sp=tab.querySelector('span'); if(sp) sp.textContent=panelDef(id).t; }
  if(sid===S.sid){ const g=$('#wbStopAll'); if(g) g.style.display=b?'inline-flex':'none'; }
}
async function msgMenu(e,sid){
  sid=sid||S.sid;
  const el=e.target.closest('.msg'); if(!el)return;
  e.preventDefault();
  const i=el.getAttribute('data-i'); if(i===null)return;
  const msgs=(V(sid).session&&V(sid).session.messages)||[];
  const m=msgs[+i]; if(!m)return;
  const text=String(m.content||'').slice(0,160);
  menu(e.clientX,e.clientY,[
    {h:m.role},
    {t:'复制这条',i:'list',fn:()=>{navigator.clipboard&&navigator.clipboard.writeText(String(m.content||''));setMsg('已复制');}},
    {t:'在本面板重新编辑',i:'redo',fn:()=>{ const inp=V(sid).els&&V(sid).els.input; if(inp){ inp.value=String(m.content||''); inp.focus(); } }},
    {sep:true},
    {t:'丢弃这条及其之后',i:'x',fn:async()=>{ await api('/api/session/truncate',{id:sid,index:+i}); await loadSession(sid); renderChat(sid); setMsg('已丢弃后续内容'); }},
    ...(m.role==='user'?[{t:'重发这条',i:'redo',fn:async()=>{ await api('/api/session/truncate',{id:sid,index:+i}); await loadSession(sid); renderChat(sid); const inp=V(sid).els&&V(sid).els.input; if(inp){ inp.value=String(m.content||''); send(sid);} }}]:[]),
    {sep:true},
    {t:'这一条：'+text.slice(0,40),fn:()=>{}},
  ]);
}
function addUser(text,sid){
  sid=sid||S.sid; const v=V(sid);
  v.live.push({k:'user',text:String(text||''),ts:Date.now()/1000});
  const box=streamEl(sid); if(!box)return;
  const div=document.createElement('div'); div.className='msg me';
  div.innerHTML=`<div class="av me">你</div><div class="bub"><div class="who">你 · ${fmtT(Date.now()/1000)}</div>${bubbleBody(text)}</div>`;
  box.appendChild(div); box.scrollTop=box.scrollHeight;

function addNotice(text,isErr,sid){
  sid=sid||S.sid; V(sid).live.push({k:'notice',text:String(text||''),err:!!isErr});
  const box=streamEl(sid)||document.getElementById('wbStream');

function bindSessions(root){
  const list=$('#wbSessList',root), search=$('#wbSessSearch',root);
  const day=t=>{ const d=new Date((t||0)*1000),n=new Date();
    if(d.toDateString()===n.toDateString())return '今天';
    const y=new Date(Date.now()-86400000); if(d.toDateString()===y.toDateString())return '昨天';
    return d.toLocaleDateString(); };
  const rel=t=>{ if(!t)return '—'; const s=Math.max(0,Date.now()/1000-t);
    if(s<60)return '刚刚'; if(s<3600)return Math.floor(s/60)+' 分钟前';
    if(s<86400)return Math.floor(s/3600)+' 小时前'; return Math.floor(s/86400)+' 天前'; };
  const isOpen=id=>!!(findTabsWith(LAYOUT,chatId(id))||floats.some(f=>f.id===chatId(id)));
  const draw=()=>{
    const q=(search.value||'').toLowerCase();
    const ss=((S.state&&S.state.sessions)||[]).slice();
    const f=ss.filter(s=>!q||((s.title||'')+' '+(s.id||'')).toLowerCase().includes(q));
    const order=S.sessSort||'time';
    f.sort((a,b)=> order==='title'? String(a.title||'').localeCompare(String(b.title||''),'zh')
                                 : ((b.updated||0)-(a.updated||0)));
    let h=`<div class="hint" id="wbSessInfo">共 ${ss.length} 个 · 已开面板 ${ss.filter(s=>isOpen(s.id)).length} 个${q?(' · 匹配 '+f.length+' 个'):''}</div>`;
    const g={}; f.forEach(s=>{const k=day(s.updated);(g[k]=g[k]||[]).push(s);});
    for(const k in g){
      h+=`<div class="sgrp">${esc(k)}</div>`;
      g[k].forEach(s=>{
        const isCur=s.id===S.sid, opened=isOpen(s.id);
        h+=`<div class="prow click sesscard${isCur?' on':''}${opened?' opened':''}" data-id="${esc(s.id)}" title="${esc(s.id)} · 点击打开对话面板">
          <span class="sdot${opened?' on':''}"></span>
          <b>${esc(s.title||'会话')}</b>
          <span class="tail">${s.messages} 条${s.checkpoints?' · '+s.checkpoints+' 变更':''} · ${rel(s.updated)}</span>
          <span class="qacts">
            <i class="qia" data-ren="${esc(s.id)}" title="重命名">✎</i>
            <i class="qia" data-dup="${esc(s.id)}" title="复制会话">⧉</i>
            <i class="qia" data-exp="${esc(s.id)}" title="导出 Markdown">⇩</i>
            <i class="qia" data-close="${esc(s.id)}" title="关闭该对话面板">⧠</i>
            <i class="qia" data-del="${esc(s.id)}" title="删除会话">✕</i>
          </span></div>`;
      });
    }
    list.innerHTML=h;
    if(!f.length) list.innerHTML+='<div class="hint">没有匹配的会话。点「＋ 新建」开一个，或在下面搜索框里换关键词。</div>';
  };
  const menueSess=(e,id)=>{
    const opened=isOpen(id);
    menu(e.clientX,e.clientY,[
      {h:(sessTitle(id)||'会话')},
      {t:'打开对话面板',i:'chat',fn:()=>openChatPanel(id)},
      {t:'在右侧再开一个面板',i:'float',fn:()=>openChatPanel(id,{side:'right'})},
      ...(opened?[{t:'关闭该对话面板',i:'x',fn:()=>{ closePanel(chatId(id)); draw(); }}]:[]),
      {sep:true},
      {t:'重命名',i:'list',fn:()=>renameSess(id)},
      {t:'复制会话',i:'plus',fn:()=>dupSess(id)},
      {t:'导出 Markdown',i:'osx',fn:()=>exportSess(id)},
      {t:'清空消息',i:'x',fn:async()=>{ if(!confirm('清空该会话的全部消息？'))return; await api('/api/session/clear',{id}); await loadSession(id); await loadState(); draw(); setMsg('已清空会话'); }},
      {sep:true},
      {t:'删除会话',i:'x',fn:()=>delSess(id)},
    ]);
  };
  search.addEventListener('input',draw);
  list.addEventListener('click',async e=>{
    const ren=e.target.getAttribute('data-ren');
    if(ren){ e.stopPropagation(); await renameSess(ren); return; }
    const dup=e.target.getAttribute('data-dup');
    if(dup){ e.stopPropagation(); await dupSess(dup); return; }
    const exp=e.target.getAttribute('data-exp');
    if(exp){ e.stopPropagation(); await exportSess(exp); return; }
    const cl=e.target.getAttribute('data-close');
    if(cl){ e.stopPropagation(); closePanel(chatId(cl)); draw(); setMsg('已关闭该对话面板'); return; }
    const del=e.target.getAttribute('data-del');
    if(del){ e.stopPropagation(); await delSess(del); return; }
    const row=e.target.closest('[data-id]'); if(!row)return;
    const id=row.getAttribute('data-id');
    if(isOpen(id)){ S.sid=id; await loadSession(id); focusPanel(chatId(id)); }
    else await openChatPanel(id);
    draw();
  });
  list.addEventListener('contextmenu',e=>{ const row=e.target.closest('[data-id]'); if(!row)return; e.preventDefault(); menueSess(e,row.getAttribute('data-id')); });
  $('#wbSessNew',root).addEventListener('click',async()=>{
    const r=await api('/api/session/new',{title:'新会话'});
    await loadState(); await openChatPanel(r.session.id); draw(); setMsg('已新建会话');
  });
  const so=$('#wbSessSort',root);
  if(so){ so.value=S.sessSort||'time'; so.onchange=()=>{ S.sessSort=so.value; draw(); }; }
  const ca=$('#wbSessCloseAll',root);
  if(ca) ca.onclick=()=>{
    const ids=allPanelsIn(LAYOUT).concat(floats.map(f=>f.id)).filter(isChatId);
    if(!ids.length){ setMsg('没有打开的对话面板'); return; }
    ids.forEach(id=>{ if(findTabsWith(LAYOUT,id))LAYOUT=removePanel(LAYOUT,id)||mkTabs([]); floats=floats.filter(f=>f.id!==id); });
    render(); renderFloats(); save(); draw(); setMsg('已关闭 '+ids.length+' 个对话面板');
  };
  draw();
}
async function renameSess(id){
  const cur=((S.state&&S.state.sessions)||[]).find(x=>x.id===id)||{};
  const t=prompt('重命名会话：',cur.title||''); if(t===null)return;
  const r=await api('/api/session/rename',{id,title:t});
  if(r.ok){ await loadState(); if(V(id).session) V(id).session.title=t; updateChatTabs(); refreshPanel('sessions'); setMsg('已重命名'); }
}
async function dupSess(id){
  const r=await api('/api/session/duplicate',{id});
  if(r.ok&&r.session){ await loadState(); await openChatPanel(r.session.id); refreshPanel('sessions'); setMsg('已复制会话'); }
  else setMsg('复制失败：'+((r&&r.error)||''),'warn');
}
async function exportSess(id){
  const r=await api('/api/session?id='+encodeURIComponent(id));
  if(r.ok) exportMarkdown(r.session); else setMsg('导出失败','warn');
}
async function delSess(id){
  if(!confirm('删除这个会话？（不可恢复）'))return;
  await api('/api/session/delete',{id});
  closePanel(chatId(id));
  for(const s in S.views){ if(s===id) delete S.views[s]; }
  if(S.sid===id) S.sid=null;
  await loadState(); await openFirst(); refreshPanel('sessions'); renderFloats();
}

async function probeModel(root,announce){
  if(announce) setMsg('探测中…','warn');
  const r=await api('/api/probe',{}); const p=r.probe||{};
  setConn(!!p.ok);
  const box=$('#wbModelList',root);
  if(box) box.innerHTML=p.ok
    ? `<div class="hint">${p.ms}ms · ${p.models.length} 个模型（点击即填入）</div>`+
      p.models.map(m=>`<div class="prow click" data-m="${esc(m)}"><b class="mono">${esc(m)}</b></div>`).join('')
    : `<span style="color:var(--err)">${esc(p.error||'失败')}</span>`;
  if(box) box.onclick=ev=>{ const m=ev.target.closest('[data-m]'); if(!m)return;
    $('#wbModelName',root).value=m.dataset.m; $('#wbModelApply',root)&&($('#wbModelSel',root).value=m.dataset.m);
    $('#wbModelSave',root).click(); };
  if(p.ok&&p.models.length){ const sel=$('#wbModelSel',root); if(sel) sel.innerHTML=p.models.map(m=>`<option ${m===$('#wbModelName',root).value?'selected':''}>${esc(m)}</option>`).join(''); }
  if(announce) setMsg(p.ok?('已连接 · '+p.models.length+' 个模型'):'连接失败',p.ok?'ok':'err');
  return p;
}

function bindTools(root){
  const sel=$('#wbToolSel',root), st=S.state||{};
  sel.innerHTML=(st.tools||[]).map(t=>`<option value="${esc(t.name)}">${esc(t.name)} · ${esc(t.group)}${t.mutating?' ⚠':''}</option>`).join('');
  const draw=()=>{
    const t=(st.tools||[]).find(x=>x.name===sel.value)||(st.tools||[])[0]; if(!t)return;
    $('#wbToolDesc',root).innerHTML=`<b>${esc(t.name)}</b> <span class="tag">${esc(t.group)}</span><br>${esc(t.desc)}${t.mutating?'<br><span style="color:var(--warn)">⚠ 执行前需要审批</span>':''}`;
    const props=(t.parameters&&t.parameters.properties)||{}, req=(t.parameters&&t.parameters.required)||[];
    let h='';
    Object.keys(props).forEach(k=>{
      const sp=props[k]||{}, typ=sp.type||'string', label=k+(req.includes(k)?' *':'');
      if(sp.enum) h+=`<div class="wbfld"><label>${esc(label)}</label><select data-arg="${esc(k)}" data-typ="enum">${sp.enum.map(v=>`<option>${esc(v)}</option>`).join('')}</select></div>`;
      else if(typ==='boolean') h+=`<div class="wbfld"><label class="wbrow" style="cursor:pointer"><input type="checkbox" data-arg="${esc(k)}" data-typ="boolean" style="width:auto;flex:0 0 auto"> ${esc(label)}</label></div>`;
      else if(['content','code','old','new','text'].includes(k)) h+=`<div class="wbfld"><label>${esc(label)}</label><textarea data-arg="${esc(k)}" data-typ="${typ}"></textarea></div>`;
      else h+=`<div class="wbfld"><label>${esc(label)}</label><input data-arg="${esc(k)}" data-typ="${typ}"></div>`;
    });
    $('#wbToolForm',root).innerHTML=h||'<div class="hint">该工具不需要参数。</div>';
  };
  sel.onchange=draw; draw();
  const collect=()=>{ const args={};
    $$('#wbToolForm [data-arg]',root).forEach(el=>{
      const k=el.getAttribute('data-arg'), typ=el.getAttribute('data-typ');
      let v=typ==='boolean'?el.checked:el.value;
      if(typ==='integer') v=parseInt(v||'0',10)||0; else if(typ==='number') v=parseFloat(v||'0')||0;
      if(v===''&&typ!=='boolean')return; args[k]=v; });
    return args; };
  $('#wbToolRun',root).onclick=async()=>{
    const name=sel.value, args=collect();
    $('#wbToolOut',root).textContent='运行中…'; setMsg('执行 '+name+' …');
    const r=await api('/api/tool',{name,args,session_id:S.sid}); const res=r.result||{};
    $('#wbToolOut',root).textContent=`[${name}] ${res.ok?'✔ 成功':'✘ 失败'} ${res.ms||0}ms\n参数：${JSON.stringify(args)}\n\n${res.text||''}`+
      (r.checkpoints!=null?`\n\n（本会话检查点共 ${r.checkpoints} 个，可在「变更」面板回滚）`:'');
    logObs({type:'tool',name,ok:!!res.ok,ms:res.ms||0});
    setMsg(name+(res.ok?' 成功':' 失败'),res.ok?'ok':'err');
    if(S.sid){ const rr=await api('/api/session?id='+encodeURIComponent(S.sid)); if(rr.ok){ S.cps=rr.checkpoints||[]; renderChanges(); } }
  };
  $('#wbToolClear',root).onclick=()=>{ $('#wbToolOut',root).textContent='尚未运行工具。'; };
}

function rtCards(){
  const c=(S.state&&S.state.ctx)||{}, r=S.obs.last;
  const rt=V(S.sid).runTools||[];
  return [['turn',r?r.steps:0,'本次步数'],['tools',rt.length,'工具调用'],
          ['tokens',(S.state&&S.state.ctx&&S.state.ctx.used)||0,'会话 tokens'],
          ['ms',r?(r.elapsed||0):0,'本轮秒数']];

function renderRuntime(root){
  root=root||document;
  const box=$('#wbRtCards',root); if(!box)return;
  box.innerHTML=rtCards().map(a=>`<div class="pcell"><b>${esc(a[1])}</b><s>${esc(a[2])}</s></div>`).join('');
  const flow=$('#wbRtFlow',root);
  if(flow){ const n=S.obs.last?S.obs.last.steps:0; const mx=(S.state&&S.state.prefs&&S.state.prefs.max_steps)||40;
    let h=''; for(let i=1;i<=Math.max(1,Math.min(mx,12));i++) h+=`<span class="st ${i<=n?'hi':''}">${i}</span>${i<Math.min(mx,12)?'<span class="ar">→</span>':''}`;
    flow.innerHTML=h+`<span class="ar">／ 上限 ${mx}</span>`; }
  const tl=$('#wbRtTools',root);
  const rtl=V(S.sid).runTools||[];
  if(tl) tl.innerHTML=(rtl.length?rtl.slice(-30).reverse():[]).map(t=>
    `<div class="prow"><b class="mono">${esc(t.name)}</b><span class="ptag ${t.ok?'ok':'err'}">${t.ok?'✔':'✘'}</span><span class="tail">${t.ms||0}ms</span></div>`).join('')
    || '<div class="hint">这一轮还没有工具调用。</div>';
}

function bindSettings(root){
  const st=S.state||{}, prefs=st.prefs||{};
  const body=$('#wbSetBody',root);
  const msg=(t,cls)=>{ const e=$('#wbSetMsg',root); if(e){ e.textContent=t||''; e.className='savemsg'+(cls?' '+cls:''); } };
  /* 外观 */
  const setTheme=t=>{ document.documentElement.dataset.theme=t; $$('.swt',root).forEach(b=>b.classList.toggle('on',b.dataset.t===t)); savePrefs(); };
  $$('.swt',root).forEach(b=>b.onclick=()=>setTheme(b.dataset.t));
  setTheme(document.documentElement.dataset.theme||'dark');
  $$('.sw',root).forEach(s=>{ s.onclick=()=>{ setAccent(s.dataset.c); $$('.sw',root).forEach(x=>x.classList.toggle('on',x===s)); };
    if(s.dataset.c===prefs.accent)s.classList.add('on'); });
  const cb=$('#setRestore',root); cb.checked=prefs.restore!==false;
  cb.onchange=()=>{ prefs.restore=cb.checked; savePrefs(); };
  $$('[data-act]',root).forEach(r=>r.onclick=()=>{ const a=r.dataset.act;
    if(a==='reset')resetLayout(); else if(a==='export')exportLayout(); else if(a==='import')importLayout(); });
  const pn=$('#wbSetPanels',root);
  if(pn) pn.textContent=allPanelsIn(LAYOUT).concat(floats.map(f=>f.id)).length+' 个';

  /* 字段初值 */
  const F=k=>$('[data-pref="'+k+'"]',root);
  const put=(k,v)=>{ const el=F(k); if(!el)return; if(el.type==='checkbox') el.checked=!!v; else el.value=(v==null?'':v); };
  ['temperature','max_steps','timeout','shell_timeout','max_output_tokens','retries','keep_checkpoints',
   'price_in','price_out','qa_max','proxy','sandbox','approve_mutating','enable_tools','auto_compact','auto_title','qa_first']
    .forEach(k=>put(k,prefs[k]));
  if(F('qa_max')&&prefs.qa_max==null) put('qa_max',4);
  const sysEl=$('#wbSys',root); if(sysEl) sysEl.value=st.system_prompt||'';
  $('#wbWs',root).value=st.workspace||'';
  $('#wbWsSave',root).onclick=async()=>{ await api('/api/settings',{workspace:$('#wbWs',root).value.trim()}); await loadState(); msg('工作区已保存','ok'); };

  const collect=()=>{ const out={};
    $$('[data-pref]',root).forEach(el=>{
      const k=el.dataset.pref;
      if(el.type==='checkbox') out[k]=el.checked;
      else if(el.type==='number'){ const s=el.value.trim(); out[k]=s===''?0:Number(s); }
      else out[k]=el.value.trim();
    });
    return out; };
  let base=JSON.parse(JSON.stringify(collect()));
  const dirtyKeys=()=>{ const cur=collect(), ks=[]; Object.keys(cur).forEach(k=>{ if(String(cur[k])!==String(base[k])) ks.push(k); }); return ks; };
  const markDirty=()=>{
    const ks=dirtyKeys(); const d=$('#wbSetDirty',root);
    if(d) d.innerHTML=ks.length?('<span style="color:var(--warn)">未保存 '+ks.length+' 项：'+ks.join('、')+'</span>'):'';
    $$('[data-pref]',root).forEach(el=>{
      let bad=false;
      if(el.type==='number'&&el.value.trim()!==''){
        const v=Number(el.value), min=el.dataset.min, max=el.dataset.max;
        if(isNaN(v)) bad=true;
        else { if(min!==undefined&&v<Number(min)) bad=true; if(max!==undefined&&v>Number(max)) bad=true; }
      }
      el.classList.toggle('fldbad',bad);
    });
  };
  body.addEventListener('input',markDirty); body.addEventListener('change',markDirty);
  markDirty();
  $('#wbSSave',root).onclick=async()=>{
    const ks=dirtyKeys();
    if(!ks.length){ msg('没有改动需要保存'); return; }
    const cur=collect(); const bad=[];
    $$('[data-pref]',root).forEach(el=>{
      if(el.type!=='number')return;
      const v=Number(el.value), min=el.dataset.min, max=el.dataset.max;
      if(el.value.trim()===''||isNaN(v)){ bad.push(el.dataset.pref+' 必须是数字'); return; }
      if(min!==undefined&&v<Number(min)) bad.push(el.dataset.pref+' ≥ '+min);
      if(max!==undefined&&v>Number(max)) bad.push(el.dataset.pref+' ≤ '+max);
    });
    if(bad.length){ msg('请先修正：'+bad.join('；'),'err'); return; }
    const prefBody={}; ks.forEach(k=>prefBody[k]=cur[k]);
    const btn=$('#wbSSave',root); btn.disabled=true;
    try{
      const r=await api('/api/settings',{prefs:prefBody});
      if(!r.ok){ msg('保存失败：'+(r.error||''),'err'); return; }
      await api('/api/qa',{qa_first:!!cur.qa_first, qa_max:cur.qa_max});
      await loadState();
      base=JSON.parse(JSON.stringify(collect()));
      markDirty();
      msg('已保存 '+ks.length+' 项：'+ks.join('、'),'ok');
      setMsg('设置已保存（'+ks.length+' 项）','ok');
      updateChatTabs();
    } finally{ btn.disabled=false; }
  };
  $('#wbSReload',root).onclick=async()=>{ await loadState(); refreshPanel('settings'); setMsg('已放弃未保存的改动'); };
  $('#wbSTest',root).onclick=async()=>{ msg('正在探测模型端点…');
    const r=await api('/api/probe',{}); const p=r.probe||{};
    msg(p.ok?('连接正常 · '+p.ms+'ms · '+((p.models||[]).length)+' 个模型'):('连接失败：'+(p.error||'')), p.ok?'ok':'err');
    setConn(!!p.ok); };
  $('#wbSysSave',root).onclick=async()=>{ await api('/api/settings',{prefs:{system:$('#wbSys',root).value}}); await loadState(); msg('系统提示词已保存','ok'); };
  const paths=st.paths||{};
  $('#wbPaths',root).innerHTML=Object.keys(paths).map(k=>'· '+k+': '+esc(paths[k])).join('<br>');
  const oh=$('#wbOpenHome2',root); if(oh) oh.onclick=async()=>{ const r=await api('/api/open_path',{path:'home'}); setMsg(r.ok?'已打开数据目录':'失败：'+(r.error||''), r.ok?'ok':'warn'); };
  const oc=$('#wbOpenCfg2',root); if(oc) oc.onclick=async()=>{ const r=await api('/api/open_path',{path:'config'}); setMsg(r.ok?'已打开配置文件':'失败：'+(r.error||''), r.ok?'ok':'warn'); };
  $('#wbDefReset',root).onclick=async()=>{
    if(!confirm('把设置恢复为默认？（价格与代理保持不变）'))return;
    await api('/api/settings/reset',{}); await loadState(); refreshPanel('settings'); setMsg('已恢复默认设置','ok');
  };
  $('#wbWipe',root).onclick=async()=>{
    if(!confirm('将删除本机的配置与会话（不可恢复）。继续？'))return;
    if(!confirm('再确认一次：确定清除全部本机数据？'))return;
    const r=await api('/api/wipe',{confirm:true});
    if(r.ok){ setMsg('已清除全部数据，正在重置界面…','warn'); S.sid=null; S.views={}; S.cps=[];
      await loadState(); await openFirst(); render(); renderFloats(); setMsg('已清除全部数据'); }
    else setMsg('失败：'+(r.error||''),'err');
  };
  /* 分组折叠 + 设置项搜索 */
  $$('.psec-h',body).forEach(h=>h.addEventListener('click',()=>{
    const sec=h.parentElement; sec.classList.toggle('collapsed');
    const tg=h.querySelector('.tg'); if(tg) tg.textContent=sec.classList.contains('collapsed')?'展开':'收起';
  }));
  const q=$('#wbSetQ',root);
  if(q) q.addEventListener('input',()=>{
    const s=q.value.trim().toLowerCase();
    $$('.psec',body).forEach(sec=>{
      const kw=((sec.dataset.kw||'')+' '+sec.textContent).toLowerCase();
      sec.style.display=(!s||kw.includes(s))?'':'none';
    });
  });
}

  };
}

function bindContract(root){

    $('#wbCtInfo',root).innerHTML=`共 <b>${r.total||0}</b> 个 · 进行中 ${its.filter(x=>['signed','active','checking'].includes(x.state)).length} · 已结算 ${its.filter(x=>x.state==='settled').length} · 目录 <span class="mono">${esc(r.dir||'')}</span>`;
    $('#wbCtList',root).innerHTML=its.length?its.map(c=>`<div class="prow"><b class="mono">${esc(c.id)}</b>
      <span class="ptag ${c.state==='settled'?'ok':(c.state==='breached'?'err':(c.state==='closed'?'':'warn'))}">${esc(c.state)}</span>
      <span class="tail">${esc(String(c.goal||'').slice(0,40))} · ${c.pass||0}/${c.total||0}</span>
      <span class="qacts"><i class="qia" data-cta="get" data-ctid="${esc(c.id)}" title="详情">≡</i><i class="qia" data-cta="sign" data-ctid="${esc(c.id)}" title="签署">✍</i><i class="qia" data-cta="start" data-ctid="${esc(c.id)}" title="开始">▶</i><i class="qia" data-cta="check" data-ctid="${esc(c.id)}" title="检查（全部通过）">✓</i><i class="qia" data-cta="settle" data-ctid="${esc(c.id)}" title="结算">⚖</i><i class="qia" data-cta="report" data-ctid="${esc(c.id)}" title="生成报告">📄</i><i class="qia" data-cta="breach" data-ctid="${esc(c.id)}" title="标记违约">⚠</i><i class="qia" data-cta="del" data-ctid="${esc(c.id)}" title="删除">✕</i></span></div>`).join('')
      :'<div class="hint">还没有契约。填写目标与验收项，点「新建」；模型也能用 contract 工具创建/守卫/结算。</div>';
  };
  draw();
  $('#wbCtReload',root).onclick=draw;
  $('#wbCtCreate',root).onclick=async()=>{
    const goal=$('#wbCtGoal',root).value.trim(); if(!goal){ setMsg('需要目标','warn'); return; }
    const evals=$('#wbCtEvals',root).value.split('\n').map(s=>s.trim()).filter(Boolean);
    const deny=$('#wbCtDeny',root).value.split('\n').map(s=>s.trim()).filter(Boolean);
    const r=await api('/api/contracts',{action:'create',goal,evals,deny});
    if(r.ok){ setMsg('契约已创建：'+r.id,'ok'); $('#wbCtGoal',root).value=''; draw(); }
    else setMsg('失败：'+(r.error||''),'warn');
  };
  $('#wbCtList',root).onclick=async e=>{
    const a=e.target.getAttribute('data-cta'); if(!a)return;
    const id=e.target.getAttribute('data-ctid');
    if(a==='get'){ const r=await api('/api/contracts/get?id='+encodeURIComponent(id)); if(r.ok) show(r); return; }
    if(a==='report'){ const r=await api('/api/contracts',{action:'report',id});
      if(r.ok){ $('#wbCtViewSec',root).style.display='block'; $('#wbCtViewTitle',root).textContent='报告 '+id; $('#wbCtView',root).textContent=r.text; addNotice('契约报告已生成：'+r.path); } return; }
    if(a==='del'){ if(!confirm('删除契约 '+id+' ？'))return; await api('/api/contracts',{action:'delete',id}); draw(); setMsg('已删除'); return; }
    if(a==='check'){ const r=await api('/api/contracts',{action:'check',id,all_pass:true}); setMsg(r.text||'检查完成', r.ok?'ok':'warn'); draw(); return; }
    if(a==='settle'){ const r=await api('/api/contracts',{action:'settle',id,ai:['面板结算'],user:['用户确认']}); setMsg(r.text||'', r.ok?'ok':'warn'); draw(); return; }
    if(a==='breach'){ const why=prompt('违约原因（可空）','')||''; await api('/api/contracts',{action:'breach',id,reason:why}); draw(); setMsg('已标记违约','warn'); return; }
    const r=await api('/api/contracts',{action:a,id}); setMsg(r.text||r.error||a, r.ok?'ok':'warn'); draw();
  };
}

function bindFiles(root){
  let cur='', file=null, mode='preview', filter='';
  const setState=t=>{ const e=$('#wbFsState',root); if(e) e.textContent=t||''; };
  const setMode=m=>{ mode=m; drawModes(); renderPreview(); };
  const drawModes=()=>{
    const box=$('#wbFsModes',root); if(!box)return;
    if(!file){ box.innerHTML=''; return; }
    const p=file.path||'';
    const isMd=/\.(md|markdown)$/i.test(p), isImg=/\.(png|jpe?g|gif|webp|bmp|svg|ico)$/i.test(p);
    const tabs=[];
    if(!isImg) tabs.push(['preview','预览']);
    if(isMd) tabs.push(['source','源码']);
    if(!isImg) tabs.push(['edit','编辑']);
    box.innerHTML=tabs.map(t=>`<button class="qbtn${mode===t[0]?' acc':''}" data-mode="${t[0]}">${t[1]}</button>`).join('');
    box.onclick=e=>{ const m=e.target.getAttribute('data-mode'); if(m) setMode(m); };
  };
  const renderPreview=()=>{
    const img=$('#wbFsImg',root), pv=$('#wbFsPreview',root), ta=$('#wbFsBody',root);
    img.style.display='none'; pv.style.display='none'; ta.style.display='none';
    if(!file)return;
    const p=file.path||'';
    const isImg=/\.(png|jpe?g|gif|webp|bmp|svg|ico)$/i.test(p);
    const isMd=/\.(md|markdown)$/i.test(p);
    if(isImg){
      img.style.display='block';
      img.innerHTML=`<img class="fsimg" alt="${esc(p)}" src="/api/fs/raw?path=${encodeURIComponent(p)}&t=${encodeURIComponent(TOK||'')}">`;
      return;
    }
    if(file.binary){ pv.style.display='block'; pv.innerHTML='<div class="hint">这是二进制文件（含空字节），不能按文本预览。可用「系统打开」交给本机程序。</div>'; return; }
    if(mode==='edit'){ ta.style.display='block'; if(ta.dataset.path!==p){ ta.value=file.text||''; ta.dataset.path=p; } return; }
    pv.style.display='block';
    const text=String(file.text||'');
    if(isMd&&mode!=='source'){
      pv.innerHTML='<div class="fspv">'+md(text)+'</div>';
      try{ enhance(pv); }catch(e){}
      return;
    }
    pv.innerHTML='<pre class="fsprev"><code>'+esc(text)+'</code></pre>';
    const code=pv.querySelector('code');
    if(code&&window.hljs){ try{ const l=fsLang(p); if(l)code.className='language-'+l; window.hljs.highlightElement(code); }catch(e){} }
    if(!text) pv.innerHTML='<div class="hint">（空文件）</div>';
  };
  const crumb=p=>{
    const c=$('#wbFsCrumb',root); if(!c)return;
    const parts=String(p||'').split(/[\\/]+/).filter(Boolean);
    let h='', acc='';
    parts.forEach((seg,i)=>{
      acc = (i===0&&/^[A-Za-z]:$/.test(seg)) ? seg+'\\' : (acc?(acc.replace(/[\\/]$/,'')+'\\'+seg):seg);
      const full=/^[A-Za-z]:$/.test(seg)?(seg+'\\'):acc;
      h+=`<a data-fsgo="${esc(full)}">${esc(seg)}</a>`+(i<parts.length-1?'<span>›</span>':'');
    });
    c.innerHTML='<a data-fsgo="">工作区</a><span>›</span>'+h;
    c.onclick=e=>{ const g=e.target.getAttribute('data-fsgo'); if(g!==null) draw(g); };
  };
  const draw=async p=>{
    const r=await api('/api/fs'+(p?('?path='+encodeURIComponent(p)):''))
      .catch(()=>({ok:false,error:'请求失败'}));
    if(!r.ok){ setMsg('打开失败：'+(r.error||''),'warn'); return; }
    if(r.file){ await openFile(r.path); return; }
    cur=r.path||''; crumb(cur);
    const items=(r.entries||[]).filter(x=>!filter||x.name.toLowerCase().includes(filter));
    $('#wbFsList',root).innerHTML=items.length?items.map(x=>{
      const full=cur.replace(/[\\/]$/,'')+'\\'+x.name;
      return `<div class="fsrow${file&&file.path===full?' on':''}" data-fs="${esc(full)}" data-dir="${x.dir?'1':''}">
        <span>${x.dir?'📁':'📄'}</span><span class="nm">${esc(x.name)}</span>
        <span class="sz">${x.dir?'目录':(x.size<1024?x.size+' B':(x.size<1048576?(x.size/1024).toFixed(1)+' KB':(x.size/1048576).toFixed(2)+' MB'))} · ${x.mtime?fmtT(x.mtime):''}</span></div>`;
    }).join(''):'<div class="hint">空目录'+(filter?'（或没有匹配项）':'')+'。</div>';
    setState(items.length+' 项'+(r.dirs!=null?('（目录 '+r.dirs+' · 文件 '+r.files+'）'):''));
  };
  const openFile=async(p,toMode)=>{
    const r=await api('/api/fs/read?path='+encodeURIComponent(p));

    const ta=$('#wbFsBody',root); ta.dataset.path='';
    mode=toMode||(/\.(png|jpe?g|gif|webp|bmp|svg|ico)$/i.test(p)?'preview':'preview');
    drawModes(); renderPreview();
    setState('已打开 '+(r.path||p));
  };
  draw('');
  $('#wbFsGo',root)&&($('#wbFsGo',root).onclick=()=>draw($('#wbFsPath',root).value.trim()));
  $('#wbFsHome',root).onclick=()=>draw('');
  $('#wbFsRefresh',root).onclick=()=>draw(cur);
  $('#wbFsUp',root).onclick=()=>draw(cur.replace(/[\\/][^\\/]+$/,'')||cur);
  $('#wbFsOpenOs',root).onclick=async()=>{ const r=await api('/api/open_path',{path:cur||undefined});
    setMsg(r.ok?'已在系统里打开目录':'打开失败：'+(r.error||''), r.ok?'ok':'warn'); };
  const fq=$('#wbFsFilter',root);
  if(fq) fq.addEventListener('input',()=>{ filter=fq.value.trim().toLowerCase(); draw(cur); });
  $('#wbFsList',root).onclick=e=>{
    const row=e.target.closest('[data-fs]'); if(!row)return;
    const p=row.getAttribute('data-fs');
    if(row.getAttribute('data-dir')==='1') draw(p); else openFile(p);
  };
  $('#wbFsList',root).oncontextmenu=e=>{
    const row=e.target.closest('[data-fs]'); if(!row)return; e.preventDefault();
    const p=row.getAttribute('data-fs');
    const isDir=row.getAttribute('data-dir')==='1';
    menu(e.clientX,e.clientY,[
      {h:String(p).split(/[\\/]/).pop()},
      {t:isDir?'打开目录':'预览/编辑',i:'book',fn:()=>{ isDir?draw(p):openFile(p); }},
      {t:'在系统里打开',i:'osx',fn:async()=>{ const r=await api('/api/open_path',{path:p}); setMsg(r.ok?'已交给本机程序打开':'失败：'+(r.error||''), r.ok?'ok':'warn'); }},
      {t:'复制路径',i:'list',fn:()=>{ try{ navigator.clipboard.writeText(p); setMsg('已复制路径'); }catch(_){ setMsg('复制失败','warn'); } }},
      {sep:true},
      {t:'重命名…',i:'list',fn:async()=>{ const to=prompt('重命名为（完整新路径）',p); if(!to||to===p)return;
        const r=await api('/api/fs/rename',{path:p,to}); setMsg(r.ok?'已重命名':'失败：'+(r.error||''), r.ok?'ok':'warn'); draw(cur); }},
      {t:'删除',i:'x',fn:async()=>{ if(!confirm('删除 '+p+' ？（文本文件可回滚）'))return;

function bindCron(root){
  const draw=async()=>{
    const [r,lg]=await Promise.all([api('/api/cron'),api('/api/cron/logs?limit=30')]);
    const ts=r.tasks||[];
    $('#wbCronInfo',root).innerHTML=`共 <b>${ts.length}</b> 个任务（启用 ${ts.filter(t=>t.enabled).length}） · 1 秒节拍 · <span class="mono">${esc(r.path||'')}</span>`;
    $('#wbCronList',root).innerHTML=ts.length?ts.map(t=>`<div class="prow"><b>${esc(t.name)}</b>
      <span class="ptag ${t.enabled?'ok':''}">${t.enabled?'启用':'停用'}</span>
      <span class="tail mono">${esc(t.cron)} · ${esc(t.type)}${t.remaining!=null?(' · 剩 '+t.remaining):''}</span>
      <span class="qacts"><i class="qia" data-crun="${esc(t.id)}" title="立即执行">▶</i><i class="qia" data-ctg="${esc(t.id)}" data-ctv="${t.enabled?0:1}" title="启用/停用">⏻</i><i class="qia" data-cdel="${esc(t.id)}" title="删除">✕</i></span>
      ${t.last_result?`<div class="hint" style="flex-basis:100%">上次 ${esc(String(t.last_result).slice(0,160))}</div>`:''}</div>`).join('')
      :'<div class="hint">还没有定时任务。创建后由后端调度器按 6 段 cron 到点执行（进程重启后依然生效）。</div>';
    $('#wbCrLogs',root).innerHTML=(lg.logs||[]).slice().reverse().slice(0,10).map(x=>`<div class="plog"><span class="t">${fmtT(x.ts)}</span>
      <span class="lv ${x.ok?'i':'e'}">${x.ok?'OK':'ERR'}</span>
      <span style="color:var(--ink2)">${esc(x.name||'')} · ${esc(String(x.text||'').slice(0,180))}</span></div>`).join('')||'<div class="hint">暂无执行记录。</div>';
    $('#wbCronList',root).onclick=async e=>{
      const run=e.target.getAttribute('data-crun');
      if(run){ await api('/api/cron',{action:'run_now',id:run}); setMsg('已触发，稍后自动刷新…','warn'); setTimeout(draw,1600); return; }
      const tg=e.target.getAttribute('data-ctg');
      if(tg){ await api('/api/cron',{action:e.target.getAttribute('data-ctv')==='1'?'enable':'disable',id:tg}); draw(); return; }
      const dl=e.target.getAttribute('data-cdel');
      if(dl){ if(!confirm('删除任务 '+dl+' ？'))return; await api('/api/cron',{action:'delete',id:dl}); draw(); setMsg('已删除任务'); }
    };
  };
  draw();
  $('#wbCrCreate',root).onclick=async()=>{
    const name=$('#wbCrName',root).value.trim(), cron=$('#wbCrExpr',root).value.trim(),
      type=$('#wbCrType',root).value, body=$('#wbCrBody',root).value;
    if(!name||!cron){ setMsg('需要名称和 cron 表达式','warn'); return; }
    const payload={action:'create',name,cron,type,allow_mutating:$('#wbCrAllow',root).checked};
    if(type==='bash') payload.script=body;
    else if(type==='prompt') payload.prompt=body;
    else { try{ payload.requests=JSON.parse(body||'[]'); }catch(e){ setMsg('http 任务需要 JSON 数组','warn'); return; } }
    const r=await api('/api/cron',payload);
    if(r.ok){ setMsg('已创建任务：'+name,'ok'); $('#wbCrName',root).value=''; $('#wbCrBody',root).value=''; draw(); }
    else setMsg('失败：'+(r.error||''),'warn');
  };
}

/* ---------- 布局树 ---------- */
function mkTabs(items){ return {k:'tabs',id:nid(),items:items.slice(),active:0}; }
function mkSplit(dir,children){ return {k:'split',id:nid(),dir,children,sizes:children.map(()=>100/children.length)}; }
function allPanelsIn(node,out){ out=out||[]; if(node.k==='tabs')out.push(...node.items); else node.children.forEach(c=>allPanelsIn(c,out)); return out; }
function countNodes(n){ return n.k==='tabs'?1:1+n.children.reduce((a,c)=>a+countNodes(c),0); }

/* 默认布局：对话为主，其余停靠右列 */
function defaultLayout(){
  const right=mkSplit('col',[
    mkTabs(['sessions']),
    mkTabs(['models','tools']),
    mkTabs(['runtime','context','changes']),
    mkTabs(['observe','errors']),
    mkTabs(['memory','skills','mcp','plugins','cron']),
    mkTabs(['contract','plan','approvals','api']),
    mkTabs(['files','artifacts']),
    mkTabs(['selftest','console']),
    mkTabs(['settings','about','shortcuts']),
  ]);
  right.sizes=[11,11,12,11,11,11,11,11,11];
  const left=mkSplit('col',[
    mkTabs(['chat']),
    mkTabs(['console']),
  ]);
  left.sizes=[76,24];
  const root=mkSplit('row',[left,right]);
  root.sizes=[74,26];
  return root;
}

let LAYOUT=null; let floats=[]; let maxStash=null;

/* ---------- 渲染 ---------- */
function render(){
  const root=$('#qroot');
  root.innerHTML='';
  root.appendChild(renderNode(LAYOUT));
  applyOverflowUI();
}
function applyOverflowUI(){
  $$('.qtabs').forEach(bar=>{
    const wrap=bar.closest('.qpanel'); if(!wrap||!wrap.__node)return;
    const scr=$('.qtabs-scroll',bar);
    const over=scr.scrollWidth>scr.clientWidth+2;
    let btn=$('.qoverflow',bar);
    if(over&&!btn){
      btn=document.createElement('button'); btn.className='qoverflow'; btn.title='全部标签';
      btn.innerHTML=svg('chev');
      btn.addEventListener('click',e=>{e.stopPropagation();const node=bar.closest('.qpanel').__node;
        menu(e.clientX,e.clientY,node.items.map((pid,i)=>({t:panelDef(pid).t,i:panelDef(pid).i,fn:()=>{activateTab(node,i);}})));});
      bar.appendChild(btn);
    } else if(!over&&btn) btn.remove();
  });
}
function renderNode(node){
  if(node.k==='split'){
    const el=document.createElement('div'); el.className='qnode '+node.dir; el.style.flex='1';
    el.__node=node;
    node.children.forEach((c,i)=>{
      const ch=document.createElement('div'); ch.className='qchild'; ch.style.flex=node.sizes[i];
      ch.appendChild(renderNode(c)); el.appendChild(ch);
      if(i<node.children.length-1) el.appendChild(makeSplitter(node,i,el));
    });
    return el;
  }
  return renderTabs(node);
}
function makeSplitter(node,i,parentEl){
  const sp=document.createElement('div');
  sp.className='qsplit '+(node.dir==='row'?'v':'h');
  sp.title='拖动缩放 · 双击均分';
  sp.addEventListener('pointerdown',e=>{
    e.preventDefault(); sp.setPointerCapture(e.pointerId); sp.classList.add('dragging');
    const children=$$(':scope > .qchild',parentEl);
    const total=node.dir==='row'?parentEl.clientWidth:parentEl.clientHeight;

/* ---------- 树操作 ---------- */
function removePanel(node,id){
  if(node.k==='tabs'){ node.items=node.items.filter(x=>x!==id); node.active=Math.max(0,Math.min(node.active,node.items.length-1)); return node.items.length?node:null; }
  const keep=[],w=[];
  node.children.forEach((c,i)=>{ const r=removePanel(c,id); if(r){ keep.push(r); w.push(node.sizes[i]||0); } });
  if(!keep.length)return null;
  if(keep.length===1)return keep[0];
  const tot=w.reduce((a,b)=>a+b,0)||keep.length;
  node.children=keep; node.sizes=w.map(x=>x/tot*100);   // 关面板不再把剩余面板重置成等分

function insertSplit(node,target,panelId,mode){

    const first=(mode==='left'||mode==='top');
    const sp=mkSplit(dir, first?[nn,target]:[target,nn]);
    sp.sizes=first?[30,70]:[70,30];   // 新面板占 30%，原面板保持 70%（不把原面板挤成一半）
    return sp;
  }
  if(node.k==='split') node.children=node.children.map(c=>insertSplit(c,target,panelId,mode));

}
function contains(node,target){ if(node===target)return true; if(node.k==='split')return node.children.some(c=>contains(c,target)); return false; }

function closePanel(id){

function dockPanel(id,target,mode){

function floatPanel(id){

/* ---------- 拖拽停靠 ---------- */
let drag=null;
function startDragPanel(e,pid,srcNode){
  e.preventDefault();
  drag={pid,srcNode,moved:false,reorder:null};
  const g=$('#ghost'); g.innerHTML=`${svg(P[pid].i)} ${esc(P[pid].t)}`; g.style.display='block';
  moveGhost(e.clientX,e.clientY);
  const mv=ev=>{ drag.moved=true; moveGhost(ev.clientX,ev.clientY); updateIndicator(ev.clientX,ev.clientY); };
  const up=ev=>{
    document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up);
    g.style.display='none'; hideIndicators();
    if(!drag.moved){drag=null;return;}
    if(drag.reorder){ reorderTab(pid,drag.reorder.node,drag.reorder.idx,drag.reorder.side); drag=null; return; }
    const t=hitTest(ev.clientX,ev.clientY);
    if(t && t.el && t.el.__node){ dockPanel(pid,t.el.__node,t.mode); }
    else if(t && t.edge){ dockToRootEdge(pid,t.edge); }
    else { floatPanel(pid); }
    drag=null;
  };
  document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up);
}
function moveGhost(x,y){ const g=$('#ghost'); g.style.left=(x+12)+'px'; g.style.top=(y+10)+'px'; }
function hitTest(x,y){
  const el=document.elementFromPoint(x,y); if(!el)return null;
  const tabEl=el.closest('.qtab');
  if(tabEl && drag && drag.srcNode){
    const wrap=tabEl.closest('.qpanel'); const node=wrap&&wrap.__node;
    if(node===drag.srcNode && node.items.length>1){
      const tabs=$$('.qtab',tabEl.parentElement); const idx=tabs.indexOf(tabEl);
      const r=tabEl.getBoundingClientRect(); const side=(x<r.left+r.width/2)?'before':'after';
      return {reorder:{node,idx,side}};
    }
  }
  const b=$('#qbody').getBoundingClientRect(); const B=28;
  if(x<b.left+B||x>b.right-B||y<b.top+B||y>b.bottom-B){
    if(x<b.left+B)return{edge:'left'}; if(x>b.right-B)return{edge:'right'};
    if(y<b.top+B)return{edge:'top'}; if(y>b.bottom-B)return{edge:'bottom'};
  }
  const panel=el.closest('.qpanel'); if(!panel)return null;

}
function updateIndicator(x,y){
  const t=hitTest(x,y), di=$('#dropind'), ei=$('#edgeind'), ri=$('#reorderind');

  if(!t){ if(drag)drag.reorder=null; return; }
  if(t.reorder){
    if(drag)drag.reorder=t.reorder;
    const tabs=$$('.qtab').filter(el=>{const w=el.closest('.qpanel');return w&&w.__node===t.reorder.node;});
    const target=tabs[t.reorder.idx]; if(!target)return;
    const r=target.getBoundingClientRect();
    const left=(t.reorder.side==='before')?r.left:r.right;
    Object.assign(ri.style,{display:'block',left:(left-1)+'px',top:r.top+'px',height:r.height+'px'});
    return;
  }
  if(drag)drag.reorder=null;
  if(t.edge){
    const b=$('#qbody').getBoundingClientRect(); const W=Math.min(160,b.width*.14), H=Math.min(120,b.height*.14);
    Object.assign(ei.style,{display:'block'});
    if(t.edge==='left')Object.assign(ei.style,{left:b.left+'px',top:b.top+'px',width:W+'px',height:b.height+'px'});
    if(t.edge==='right')Object.assign(ei.style,{left:(b.right-W)+'px',top:b.top+'px',width:W+'px',height:b.height+'px'});
    if(t.edge==='top')Object.assign(ei.style,{left:b.left+'px',top:b.top+'px',width:b.width+'px',height:H+'px'});

  else if(t.mode==='bottom'){y0=r.top+r.height/2;h=r.height/2;}

}

/* ---------- 思考中英对照：插件 ms-translate（微软 Bing 网页端，免 key） ---------- */
const TR_TOOL='plugin_ms-translate__translate';
function trB64(s){ const b=new TextEncoder().encode(String(s||'')); let x=''; for(let i=0;i<b.length;i++) x+=String.fromCharCode(b[i]); return btoa(x); }
function trSplit(t,lim){
  const ps=String(t||'').split(/\n{2,}/); const out=[]; let cur='';
  ps.forEach(p=>{ if(cur&&(cur.length+p.length+2)>lim){ out.push(cur); cur=p; } else cur=cur?(cur+'\n\n'+p):p; });
  if(cur) out.push(cur);
  return out.length?out:[String(t||'')];
}
function trRender(z,pairs){
  if(!pairs.length){ z.innerHTML='<div class="pair"><div class="zh">没有需要翻译的英文片段（中文与代码块已原样保留）。</div></div>'; return; }
  z.innerHTML=pairs.map(p=>{
    const zh=p.zh?esc(p.zh):('<span style="color:var(--err)">'+esc(p.error||'翻译失败')+'</span>');
    return '<div class="pair">'+(p.zh?('<div class="en">'+esc(p.src)+'</div>'):'')+'<div class="zh">'+zh+'</div></div>';
  }).join('');
}
function trAutoOn(){ const b=document.getElementById('wbAutoTr'); return !b || !b.classList.contains('off'); }
async function translateThinking(msgEl){
  if(!msgEl) return;
  const think=msgEl.querySelector('.think'), bar=msgEl.querySelector('.thinkbar'), z=msgEl.querySelector('.thinkzh');
  if(!think||!z) return;
  const st=bar?bar.querySelector('.trstate'):null, btn=bar?bar.querySelector('.thinktr'):null;
  const raw=String(think.textContent||'').trim();
  if(!raw){ if(st) st.textContent='没有思考内容'; return; }
  if(z.dataset.src===raw&&z.innerHTML){ if(st) st.textContent='已翻译（内容未变）'; return; }
  if(btn) btn.disabled=true;
  if(st) st.textContent='翻译中…';
  z.style.display='block';
  const chunks=trSplit(raw,4000), pairs=[];
  try{
    for(let i=0;i<chunks.length;i++){
      if(st) st.textContent='翻译中… '+(i+1)+'/'+chunks.length;
      const r=await api('/api/tool',{name:TR_TOOL,args:{text_b64:trB64(chunks[i]),mode:'thinking'},session_id:S.sid});
      const res=(r&&r.result)||{}; let data=null;
      try{ data=JSON.parse(res.text||'{}'); }catch(e){ data=null; }
      if(!data||((!data.pairs||!data.pairs.length)&&!data.ok)) throw new Error((data&&data.error)||res.text||'翻译失败');
      (data.pairs||[]).forEach(p=>pairs.push(p));
    }
    trRender(z,pairs);
    const n=pairs.filter(p=>p.zh).length;
    if(st) st.textContent=n?('已译 '+n+' 段 · 微软 Bing 网页端'):'没有英文片段需要翻译';
    z.dataset.src=raw;
  }catch(e){ if(st) st.textContent='翻译失败：'+((e&&e.message)||e); }
  finally{ if(btn) btn.disabled=false; }
}
