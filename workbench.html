/* ---------- 事件处理（按会话隔离；live 缓冲保证任何重绘都不丢内容） ---------- */
function ensureAssistant(sid){
  const box=streamEl(sid); if(!box)return null;
  let a=box.querySelector('.msg.cur');
  if(!a){
    a=document.createElement('div'); a.className='msg cur';
    a.innerHTML=`<div class="av ai">π</div><div class="bub"><div class="who">PI</div>
      <div class="thinkwrap" style="display:none"><div class="thinkhd"><span class="icn">思考</span><span class="len"></span><span class="tg">收起</span><button class="thinktr" type="button">译成中文</button></div><div class="think"></div><div class="thinkzh"></div></div>
      <div class="tx"></div><div class="meta"></div></div>`;
    box.appendChild(a);
  }
  return a;
}
/* 流式渲染：rAF + 最短 66ms 批量刷新（每个会话各自计时，互不干扰） */
function scheduleStream(sid){
  const v=V(sid);
  v.sf=v.sf||{pending:false,last:0,timer:null};
  if(v.sf.pending||v.sf.timer)return;
  const now=(window.performance&&performance.now)?performance.now():Date.now();
  const wait=Math.max(0,66-(now-v.sf.last));
  const run=()=>{ v.sf.timer=null; v.sf.pending=true; requestAnimationFrame(()=>flushStream(sid)); };
  if(wait<=0) run(); else v.sf.timer=setTimeout(run,wait);
}
function flushStream(sid){
  const v=V(sid); v.sf=v.sf||{pending:false,last:0,timer:null};
  v.sf.pending=false; v.sf.last=(window.performance&&performance.now)?performance.now():Date.now();
  const s=v.stream||'';
  const a=ensureAssistant(sid);
  if(a){
    const tx=a.querySelector('.tx');
    if(tx){ if(/```|\*\*|`|^\s*[-*] |\|/.test(s)) tx.innerHTML=bubbleBody(s);
            else tx.innerHTML='<span style="white-space:pre-wrap">'+esc(s)+'</span>'; }
  }
  const box=streamEl(sid); if(box&&v.stick!==false) box.scrollTop=box.scrollHeight;
}
function flushStreamNow(sid){
  const v=V(sid); if(v.sf&&v.sf.timer){ clearTimeout(v.sf.timer); v.sf.timer=null; }
  if(v.stream) flushStream(sid);
  const box=streamEl(sid); if(box){ try{ enhance(box); }catch(e){} }
}
function handleEvent(e,sid){
  const v=V(sid);
  const k=e.kind, d=e.data;
  if(k==='run'){ v.runId=e.run_id; return; }
  if(k==='ping'){ if(v.busy) setMsg('生成中… '+((v.ping=(v.ping||0)+1))+'s'); return; }
  if(k==='assistant_begin'){ setMsg('生成中…'); return; }
  if(k==='reasoning_delta'){
    let t=v.live[v.live.length-1];
    if(!t||t.k!=='think'||t.done){ v.live.push({k:'think',text:''}); t=v.live[v.live.length-1]; }
    t.text+=(d||'');
    const a=ensureAssistant(sid);
    if(a){ const w=a.querySelector('.thinkwrap'); if(w){ w.style.display='block';
      const th=w.querySelector('.think'); if(th){ th.textContent=t.text; th.scrollTop=th.scrollHeight; }
      const ln=w.querySelector('.len'); if(ln) ln.textContent=t.text.length+' 字'; } }
    const box=streamEl(sid); if(box&&v.stick!==false) box.scrollTop=box.scrollHeight;
    return;
  }
  if(k==='assistant_delta'){ v.stream=(v.stream||'')+(d||''); scheduleStream(sid); return; }
  if(k==='assistant_message'){
    flushStreamNow(sid);
    if(v.stream) v.live.push({k:'assistant',text:v.stream,ts:Date.now()/1000});
    v.stream='';
    const a=ensureAssistant(sid); if(a) a.classList.remove('cur');
    return;
  }
  if(k==='step'){ setMsg('第 '+d.i+'/'+d.max+' 步…'); return; }
  if(k==='tool_start'){
    if(v.stream){ v.live.push({k:'assistant',text:v.stream,ts:Date.now()/1000}); v.stream=''; }
    const cur=ensureAssistant(sid); if(cur) cur.classList.remove('cur');
    appendLiveTool(sid,{k:'tool',id:d.id,name:d.name,args:d.args,ok:true,ms:0,text:'…',running:true});
    setMsg('执行 '+d.name+' …');
    return;
  }
  if(k==='tool_end'){
    let hit=null;
    for(let i=v.live.length-1;i>=0;i--){ const x=v.live[i]; if(x.k==='tool'&&String(x.id)===String(d.id)){ hit=x; break; } }
    if(hit){ hit.running=false; hit.ok=d.ok; hit.ms=d.ms; hit.text=d.text; }
    updateLiveTool(sid,d.id,{ok:d.ok,ms:d.ms,text:d.text});
    v.runTools=v.runTools||[]; v.runTools.push({name:d.name,ok:d.ok,ms:d.ms});
    logObs({type:'tool',name:d.name,ok:d.ok,ms:d.ms});
    if(sid===S.sid){ renderRuntime(); renderObserve(); }
    return;
  }
  if(k==='usage'){ if(sid===S.sid){ const e2=$('#wbTok'); if(e2)e2.textContent='tokens '+(d.total_tokens||0); } return; }
  if(k==='ctx'){
    if(sid===S.sid&&S.state) S.state.ctx=d;
    if(sid===S.sid){ const cx=$('#wbCtxBar'); if(cx) cx.style.width=Math.min(100,(d.ratio||0)*100).toFixed(1)+'%'; }
    return;
  }
  if(k==='checkpoint'){
    v.cps=v.cps||[]; v.cps.push(d);
    if(v.session&&v.session.checkpoints) v.session.checkpoints.push(d);
    if(sid===S.sid){ S.cps=v.cps; renderChanges(); }
    setMsg('已留检查点：'+(d.path||''));
    return;
  }
  if(k==='notice'){ addNotice(d,false,sid); return; }
  if(k==='compact_delta'){ setMsg('正在压缩上下文…'); return; }
  if(k==='title'){ loadState(); return; }
  if(k==='error'){ addNotice(String(d),true,sid); logObs({type:'error'}); return; }
  if(k==='approve'){
    const a2=d||{};
    if(S.allow[a2.name]){ api('/api/approve',{id:a2.id,allow:true}); addNotice('已按「本会话始终允许」自动批准：'+a2.name,false,sid); return; }
    showApprove(a2); return;
  }
  if(k==='ask'){ showAsk(d||{}); return; }
  if(k==='done'){
    const r=e.result||(d&&d.result)||{};
    if(S.pending){ closeModal(); S.pending=null; }
    if(S.ask){ const qa=$('#qa'); if(qa) qa.classList.remove('on'); S.ask=null; }
    flushStreamNow(sid);
    if(r.ctx&&S.state&&sid===S.sid){
      S.state.ctx=r.ctx;
      const bar=$('#wbCtxBar'); if(bar) bar.style.width=Math.min(100,(r.ctx.ratio||0)*100).toFixed(1)+'%';
      const tk=$('#wbTok'); if(tk) tk.textContent='tokens '+(r.ctx.used||0);
    }
    const a=ensureAssistant(sid);
    if(a){ const m=a.querySelector('.meta');
      if(m) m.textContent=(r.steps?('步数 '+r.steps+' · '):'')+((r.usage&&r.usage.total_tokens)?('tokens '+r.usage.total_tokens+' · '):'')+((r.elapsed||0)+'s')+((r.segments>1)?(' · 续跑 '+r.segments+' 段'):''); }
    setBusy(sid,false);
    logObs({type:'turn',steps:r.steps||0,elapsed:r.elapsed||0,usage:r.usage||{},tools:r.tools||[]});
    if(r.error){ addNotice('出错：'+r.error,true,sid); setMsg('出错','err'); }
    else if(r.stopped) setMsg('已停止（进程树已终止）','warn');
    else setMsg('完成 · '+(r.steps||0)+' 步 · '+(r.elapsed||0)+'s · '+((r.tools||[]).length)+' 次工具调用'+((r.segments>1)?(' · 自动续跑 '+(r.segments-1)+' 段'):''),'ok');
    if(sid===S.sid){ renderRuntime(); renderObserve(); }
    const trEl=ensureAssistant(sid);
    const trTxt=trEl&&trEl.querySelector('.think')?String(trEl.querySelector('.think').textContent||''):'';
    if(trAutoOn()&&trEl&&/[A-Za-z]{2,}/.test(trTxt)) translateThinking(trEl);
    /* 后端已把本轮写入会话：重取历史并清空 live，保证刷新/重绘与磁盘一致 */
    setTimeout(async()=>{
      await loadSession(sid,{keepLive:false});
      renderChat(sid);
      refreshPanel('sessions'); refreshPanel('changes');
    },260);
  }
}

/* ---------- 发送 ---------- */
async function send(sid){
  sid=sid||S.sid;
  if(!sid){ setMsg('还没有会话，先在「会话」面板新建一个','warn'); return; }
  S.sid=sid;
  const v=V(sid);
  if(v.busy){ await api('/api/stop',{run_id:v.runId,session_id:sid}); setMsg('正在停止…','warn'); return; }
  const inp=v.els&&v.els.input; if(!inp)return;
  const text=inp.value.trim();
  const att=attText(sid);
  if(!text&&!att)return;
  if(text.startsWith('/')&&!att){ if(await slash(text,sid)){ inp.value=''; return; } }
  const full=(text+'\n\n'+att).trim();
  inp.value=''; v.attach=[]; renderAtt(sid);
  addUser(full,sid);
  v.stream=''; v.runTools=[]; v.ping=0;
  setBusy(sid,true); setMsg('已发送，等待模型…');
  try{
    const res=await fetch('/api/chat?t='+encodeURIComponent(TOK),{
      method:'POST',headers:{'Content-Type':'application/json','X-PI-Token':TOK},
      body:JSON.stringify({session_id:sid,text:full})
    });
    if(!res.ok||!res.body){ addNotice('后端返回 '+res.status,true,sid); setBusy(sid,false); return; }
    const reader=res.body.getReader(), dec=new TextDecoder();
    let buf='';
    while(true){
      const {value,done}=await reader.read(); if(done)break;
      buf+=dec.decode(value,{stream:true});
      let i;
      while((i=buf.indexOf('\n\n'))>=0){
        const chunk=buf.slice(0,i); buf=buf.slice(i+2);
        if(!chunk.startsWith('data: '))continue;
        const payload=chunk.slice(6).trim();
        if(payload==='[DONE]')continue;
        try{ handleEvent(JSON.parse(payload),sid); }catch(err){}
      }
    }
  }catch(err){ addNotice('连接后端失败：'+err,true,sid); }
  finally{ if(v.busy){ flushStreamNow(sid); setBusy(sid,false); } }
}
/* ---------- 斜杠命令 ---------- */
async function slash(cmd,sid){

    chat:'打开会话面板：/chat <会话id 或 序号>',chats:'列出已打开的对话面板',close:'关闭当前对话面板',

  }

    say(`端点 ${(r.provider||{}).base_url}\n模型 ${(r.provider||{}).model}\n密钥 ${(r.provider||{}).key}\n工作区 ${r.workspace}\n工具 ${r.tools} 个`); return true; }
  if(c==='tools'){ focusPanel('tools'); say('工具：\n'+((S.state&&S.state.tools)||[]).map(t=>`  ${t.name.padEnd(10)} ${t.group}${t.mutating?' ⚠':''}`).join('\n')); return true; }
  if(c==='selftest'){ focusPanel('selftest'); const b=$('#wbSelfRun'); if(b)b.click(); return true; }
  if(c==='clear'){ if(sid){ await api('/api/session/clear',{id:sid}); await loadSession(sid); renderChat(sid); say('已清空当前会话'); } return true; }
  if(c==='new'){ const r=await api('/api/session/new',{title:'新会话'}); await loadState(); await openChatPanel(r.session.id); return true; }
  if(c==='chat'){
    const list=(S.state&&S.state.sessions)||[];
    let id=null;
    if(arg){ id=(list.find(s=>s.id===arg)||list[+arg-1]||{}).id||null; }
    if(!id){ focusPanel('sessions'); say('用法：/chat <会话id 或 序号>（在会话面板里点会话也能直接开面板）'); return true; }

    return true;
  }

  if(c==='model'){ if(arg){ await api('/api/settings',{provider:{model:arg}}); await loadState(); say('模型已切换：'+arg); }
    else say('当前模型：'+(((S.state||{}).provider||{}).model||'未选择')); return true; }
  if(c==='workspace'){ if(arg){ await api('/api/settings',{workspace:arg}); await loadState(); say('工作区已设为 '+arg); }
    else { focusPanel('settings'); say('用法：/workspace <存在的目录路径>'); } return true; }
  if(c==='run'){

      {role:'user',content:'/run '+arg},
      {role:'tool',name:'shell',content:res.text||'',ok:res.ok!==false,ms:res.ms||0,tool_call_id:'slash',args:{command:arg}}]});
    await loadSession(sid); renderChat(sid);
    say('$ '+arg+'\n\n'+(res.text||'')); setMsg(res.ok?'执行完成':'执行失败',res.ok?'ok':'err'); return true;
  }
  if(c==='attach'){ focusPanel(chatId(sid)); const b=$('#wbAttach'); if(b)b.click(); return true; }
  if(c==='title'){ if(arg&&sid){ await api('/api/session/rename',{id:sid,title:arg}); await loadState(); await loadSession(sid); renderChat(sid); updateChatTabs(); say('会话已重命名为：'+arg); }
    else say('用法：/title <名称>'); return true; }
  if(c==='stop'){ if(v.busy){ await api('/api/stop',{run_id:v.runId,session_id:sid}); setMsg('正在停止…','warn'); }
    else say('当前没有正在进行的生成。'); return true; }
  if(c==='copyall'){
    const ms=(V(sid).session&&V(sid).session.messages)||[];
    const txt=ms.map(m=>m.role==='user'?('你：'+String(m.content||'')):m.role==='assistant'?('PI：'+String(m.content||'')):('['+(m.name||'tool')+'] '+String(m.content||''))).join('\n\n');
    try{ await navigator.clipboard.writeText(txt); say('已复制全部对话（'+ms.length+' 条）到剪贴板'); }
    catch(e){ say('复制失败：'+e,true); } return true;
  }
  if(c==='export'){ exportMarkdown(V(sid).session); return true; }
  if(c==='logs'){ focusPanel('console'); return true; }
  if(c==='panels'){ focusPanel('shortcuts'); return true; }
  say('未知命令 /'+c+'，输入 /help 查看',true);
  return true;
}

/* 拉取一个会话（历史消息 + 检查点）。keepLive=true 时保留本轮 live 缓冲 */

    if(mod&&(e.key==='k'||e.key==='K')){ e.preventDefault(); openPalette(); return; }

  });

/* 老布局一次性迁移：把 PI 核心面板（记忆/技能/MCP/插件/调度/错误库）补进右列 */
function migrateLayout(){
  try{
    const ids=allPanelsIn(LAYOUT).concat(floats.map(f=>f.id));
    const col=(LAYOUT&&LAYOUT.k==='split'&&LAYOUT.dir==='row'&&LAYOUT.children&&LAYOUT.children[1]
      &&LAYOUT.children[1].k==='split')?LAYOUT.children[1]:null;
    if(!col)return;
    let changed=false;
    if(ids.indexOf('memory')<0){ col.children.push(mkTabs(['memory','skills','mcp','cron','errors'])); changed=true; }
    if(ids.indexOf('plugins')<0){ col.children.push(mkTabs(['plugins'])); changed=true; }
    if(ids.indexOf('contract')<0){ col.children.push(mkTabs(['contract','plan','approvals','api'])); changed=true; }
    if(ids.indexOf('files')<0){ col.children.push(mkTabs(['files','artifacts'])); changed=true; }
    if(changed){
      const n=col.children.length, old=col.sizes||[];
      if(old.length===n){ /* 数量没变，保留原比例 */ }
      else if(old.length){
        const added=n-old.length, addPct=Math.min(40,added*12), keep=100-addPct;
        const tot=old.reduce((a,b)=>a+b,0)||old.length;
        col.sizes=old.map(x=>x/tot*keep).concat(Array(Math.max(0,added)).fill(addPct/Math.max(1,added)));
      } else col.sizes=col.children.map(()=>100/n);
      render(); save();
    }
  }catch(e){}
}

    v.live.push({k:'tool',id:'st-tool-1',name:'shell',args:{command:'echo hi'},ok:true,ms:12,text:'hi',running:false});
    render();                                             /* 整树重绘 = 点面板/切标签的极端情况 */
    await wait(80);
    const box=streamEl(sid);
    const hasMarker=!!(box&&box.innerHTML.indexOf('__st_marker__')>=0);
    const hasTool=!!(box&&box.querySelector('.toolcard[data-tid="st-tool-1"]'));
    add('重绘不丢内容：live 缓冲 + 工具卡恢复', hasMarker&&hasTool, '标记 '+hasMarker+' · 工具卡 '+hasTool);
    const snap=JSON.stringify(serialize(LAYOUT));
    refreshPanel(chatId(sid));
    await wait(50);
    add('局部刷新不改动布局树', JSON.stringify(serialize(LAYOUT))===snap, '布局快照一致');
    /* 真实点击标签切换（等价于用户「点组件」）：切走再切回，对话内容必须还在 */
    let tabOK=false, tabDetail='';
    try{
      const chatPid=chatId(sid);
      const node=findTabsWith(LAYOUT,chatPid);
      v.live.push({k:'notice',text:'__st_marker2__'});
      if(node){
        if(!node.items.includes('console')) node.items.push('console');
        render(); await wait(80);
        const wrap=findPanelWrap(node);
        const tCon=wrap&&$$('.qtab',wrap).find(t=>t.dataset.pid==='console');
        const tChat=wrap&&$$('.qtab',wrap).find(t=>t.dataset.pid===chatPid);
        if(tCon) tCon.click(); await wait(200);
        if(tChat) tChat.click(); await wait(200);
        const b2=streamEl(sid);
        tabOK=!!(b2&&b2.innerHTML.indexOf('__st_marker2__')>=0);
        tabDetail='切到 console 再切回：内容保留 '+tabOK;
        const i2=node.items.indexOf('console'); if(i2>=0){ node.items.splice(i2,1); node.active=Math.max(0,node.active-1); }
      } else tabDetail='未找到对话面板';
    }catch(e){ tabDetail='异常 '+(e&&e.message); }
    add('点击标签切换不丢对话内容', tabOK, tabDetail);
    v.live=v.live.filter(x=>!((x&&x.k==='notice'&&(x.text==='__st_marker__'||x.text==='__st_marker2__'))||(x&&x.id==='st-tool-1')));
    render();
    const sp=mkSplit('col',[mkTabs(['x1']),mkTabs(['x2']),mkTabs(['x3'])]); sp.sizes=[50,30,20];
    const rr=removePanel(sp,'x2');            /* 50/30/20 去掉 30 → 按比例放大到 100 */
    const okSize=Math.abs(rr.sizes[0]-71.43)<0.7&&Math.abs(rr.sizes[1]-28.57)<0.7;
    add('增删面板保持原有尺寸比例（不重置为等分）', okSize, '50/30/20 去掉 30 → '+rr.sizes.map(x=>x.toFixed(1)).join('/'));
    const sp2=mkSplit('row',[mkTabs(['y1'])]);
    insertSplit(sp2,sp2.children[0],'y3','right');
    const inner=sp2.children[0];
    add('新分割 70/30（不把原面板挤成一半）',
        inner&&inner.k==='split'&&Math.abs(inner.sizes[0]-70)<0.01&&Math.abs(inner.sizes[1]-30)<0.01,
        '新分割 sizes '+(inner&&inner.sizes?inner.sizes.join('/'):'—'));
    refreshPanel('sessions'); await wait(80);
    const ncards=$$('#wbSessList .sesscard').length;
    add('会话面板：卡片渲染', ncards>0, '卡片 '+ncards+' 个');
    refreshPanel('settings'); await wait(60);
    const nf=$$('#wbSetBody [data-pref]').length;
    let filtered=false, nsec=0;
    const q=$('#wbSetQ');
    if(q){
      nsec=$$('#wbSetBody .psec').length;
      q.value='沙箱'; q.dispatchEvent(new Event('input',{bubbles:true}));
      const vis=$$('#wbSetBody .psec').filter(s=>s.style.display!=='none').length;
      filtered=vis>=1&&vis<nsec;
      q.value=''; q.dispatchEvent(new Event('input',{bubbles:true}));
    }
    add('设置面板：分组字段 + 搜索过滤', nf>=15&&filtered, '字段 '+nf+' · 分组 '+nsec+' · 过滤生效 '+filtered);
    refreshPanel('files'); await wait(120);
    const nrow=$$('#wbFsList .fsrow').length;
    let opened=false;
    const frow=$$('#wbFsList .fsrow').filter(r=>r.getAttribute('data-dir')!=='1')[0];
    if(frow){ frow.click(); await wait(500);
      const sec=$('#wbFsEditSec'); opened=!!(sec&&sec.style.display!=='none');
      if(opened){ const pv=$('#wbFsPreview'); const mdToggle=$$('#wbFsModes button'); 
        if(mdToggle.length>1){ mdToggle[1].click(); await wait(60); } }
    }
    add('文件面板：列表 + 点击即预览', nrow>0&&opened, '条目 '+nrow+' · 预览打开 '+opened);
    const sel=$('#wbSessPick');
    add('顶栏会话下拉同步', !!(sel&&sel.options.length>0), '选项 '+((sel&&sel.options.length)||0)+' · 当前 '+(S.sid||''));
  }catch(e){ add('页内自检异常', false, (e&&e.message)||String(e)); }
  const ok=rows.filter(r=>r.ok).length;
  const host=document.createElement('pre');
  host.id='webSelfTestOut';
  host.style.cssText='position:fixed;left:0;right:0;bottom:0;max-height:44vh;overflow:auto;z-index:999;background:#0a0d12;color:#e8eef5;font:11px/1.6 monospace;padding:8px;margin:0;border-top:1px solid #2f3a48';
  host.textContent='WEB SELFTEST  '+ok+'/'+rows.length+' 通过\n'+rows.map(r=>'['+(r.ok?'PASS':'FAIL')+'] '+r.n+' — '+r.d).join('\n');
  document.body.appendChild(host);
  try{ document.title='WEBST '+ok+'/'+rows.length; }catch(e){}
  return rows;
}
/* 深链接：#panel=files / #panel=settings / #session=<id> / #demo=multi（并排两个对话面板）/ #selftest=1（页内自检） */
async function applyDeepLink(){
  const raw=(location.hash||'').replace(/^#/,'');
  if(!raw)return;
  let q=null;
  try{ q=new URLSearchParams(raw); }catch(e){ return; }
  if(q.get('selftest')) await webSelfTest();
  const demo=q.get('demo');
  if(demo==='multi'){
    const list=(S.state&&S.state.sessions)||[];
    if(list[1]) await openChatPanel(list[1].id,{side:'right'});
    else setMsg('只有一个会话，先新建一个再试 #demo=multi','warn');
  }
  const sid=q.get('session');
  if(sid) await openChatPanel(sid);
  const panel=q.get('panel');
  if(panel){ focusPanel(panel); setMsg('已聚焦面板：'+panel); }
}
boot();
</script>
